<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chevarxona Pro - Statistika</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; }
        .custom-scroll::-webkit-scrollbar { height: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between pb-24">

    <!-- Top Header (Ortiqcha bo'shliq olib tashlandi, sarlavha "Jamoa reytingi" qilindi) -->
    <header class="px-4 py-3 bg-white shadow-sm flex items-center justify-between sticky top-0 z-40">
        <h1 class="font-bold text-gray-800 text-sm">Jamoa reytingi</h1>
        <span class="text-xs font-semibold bg-purple-50 text-purple-600 px-2.5 py-1 rounded-xl" id="current-date-badge">30-Iyul, 2026</span>
    </header>

    <!-- Main Content (Yuqoridagi ortiqcha bo'shliqlar qisqartirildi) -->
    <main class="p-3 space-y-2.5 max-w-xl mx-auto w-full">
        <!-- Filtr tugmalari (Kunlik, Haftalik, Oylik, Yillik) -->
        <div class="grid grid-cols-4 gap-1.5 bg-gray-100 p-1.5 rounded-2xl">
            <button onclick="switchStatTab('daily')" id="sbtn-daily" class="bg-purple-600 text-white py-2 rounded-xl text-xs font-semibold shadow-sm transition">Kunlik</button>
            <button onclick="switchStatTab('weekly')" id="sbtn-weekly" class="text-gray-500 py-2 rounded-xl text-xs font-semibold hover:bg-white transition">Haftalik</button>
            <button onclick="switchStatTab('monthly')" id="sbtn-monthly" class="text-gray-500 py-2 rounded-xl text-xs font-semibold hover:bg-white transition">Oylik</button>
            <button onclick="switchStatTab('yearly')" id="sbtn-yearly" class="text-gray-500 py-2 rounded-xl text-xs font-semibold hover:bg-white transition">Yillik</button>
        </div>

        <!-- Sana tanlash paneli -->
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
            <div class="flex items-center gap-1.5">
                <button onclick="navigateTime(-1)" class="bg-gray-100 hover:bg-purple-50 hover:text-purple-600 text-gray-600 px-2 py-1.5 rounded-xl text-xs font-bold transition" title="Oldingi">
                    <svg class="w-3.5 h-3.5 inline" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg> kun
                </button>
                <span class="font-bold text-gray-800 text-xs px-1" id="stat-date-label">30-Iyul, 2026</span>
                <button onclick="navigateTime(1)" class="bg-gray-100 hover:bg-purple-50 hover:text-purple-600 text-gray-600 px-2 py-1.5 rounded-xl text-xs font-bold transition" title="Keyingi">
                    kun <svg class="w-3.5 h-3.5 inline" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>
                </button>
            </div>
            
            <div class="relative">
                <input type="date" id="calendar-picker" onchange="onCalendarSelect(this.value)" class="absolute opacity-0 inset-0 cursor-pointer w-full h-full z-10">
                <button onclick="document.getElementById('calendar-picker').showPicker()" class="bg-purple-50 text-purple-600 hover:bg-purple-100 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                    Kalendar 
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/></svg>
                </button>
            </div>
        </div>

        <!-- 2 ta asosiy ko'rsatkich kartalari -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
                <div class="text-purple-600 mb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"/></svg>
                </div>
                <p class="text-[11px] text-gray-400">Faol xodimlar</p>
                <h4 class="text-sm font-bold text-gray-800" id="stat-active-users">1 nafar</h4>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
                <div class="text-emerald-500 mb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/></svg>
                </div>
                <p class="text-[11px] text-gray-400">Jamoa samaradorligi</p>
                <h4 class="text-sm font-bold text-gray-800" id="stat-team-eff">0%</h4>
            </div>
        </div>

        <!-- Peshqadamlar jadvali bo'limi (vaqt yozuvi olib tashlandi) -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-gray-800 text-sm">Peshqadamlar jadvali</h3>
            </div>
            
            <div id="leaderboard-list" class="space-y-2 pt-1">
                <div class="flex items-center justify-between p-2.5 rounded-xl bg-purple-50/50 border border-purple-100">
                    <div class="flex items-center gap-3">
                        <span class="w-6 h-6 rounded-full bg-purple-600 text-white flex items-center justify-center text-xs font-bold shadow-sm">1</span>
                        <div>
                            <h5 class="text-xs font-bold text-gray-800" id="user-name-display">Malika</h5>
                            <p class="text-[10px] text-gray-400">Faoliyatda</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 px-2 z-50">
        <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
            <span class="text-[10px] mt-1">Asosiy</span>
        </a>
        <a href="tarix.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
            <span class="text-[10px] mt-1">Mening tarixim</span>
        </a>
        <a href="statistika.html" class="flex flex-col items-center text-purple-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/></svg>
            <span class="text-[10px] mt-1 font-medium">Statistika</span>
        </a>
        <a href="profil.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/></svg>
            <span class="text-[10px] mt-1">Profil</span>
        </a>
    </nav>

    <script>
        let currentDate = new Date();
        let currentStatTab = 'daily';

        function formatDateKey(date) {
            let y = date.getFullYear();
            let m = String(date.getMonth() + 1).padStart(2, '0');
            let d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getDisplayDateText(date) {
            if (currentStatTab === 'daily') {
                return date.toLocaleDateString('uz-UZ', { day: 'numeric', month: 'long', year: 'numeric' });
            } else if (currentStatTab === 'weekly') {
                let startOfWeek = new Date(date);
                startOfWeek.setDate(date.getDate() - date.getDay() + (date.getDay() === 0 ? -6 : 1));
                let endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6);
                const opts = { day: 'numeric', month: 'short' };
                return `${startOfWeek.toLocaleDateString('uz-UZ', opts)} — ${endOfWeek.toLocaleDateString('uz-UZ', opts)}, ${endOfWeek.getFullYear()}`;
            } else if (currentStatTab === 'monthly') {
                return date.toLocaleDateString('uz-UZ', { month: 'long', year: 'numeric' });
            } else if (currentStatTab === 'yearly') {
                return `${date.getFullYear()}-yil`;
            }
        }

        function updateView() {
            let dateStr = formatDateKey(currentDate);
            document.getElementById('calendar-picker').value = dateStr;
            let displayTxt = getDisplayDateText(currentDate);
            document.getElementById('stat-date-label').innerText = displayTxt;
            document.getElementById('current-date-badge').innerText = displayTxt;

            loadStatData();
        }

        function navigateTime(direction) {
            if (currentStatTab === 'daily') {
                currentDate.setDate(currentDate.getDate() + direction);
            } else if (currentStatTab === 'weekly') {
                currentDate.setDate(currentDate.getDate() + (direction * 7));
            } else if (currentStatTab === 'monthly') {
                currentDate.setMonth(currentDate.getMonth() + direction);
            } else if (currentStatTab === 'yearly') {
                currentDate.setFullYear(currentDate.getFullYear() + direction);
            }
            updateView();
        }

        function onCalendarSelect(val) {
            if (val) {
                currentDate = new Date(val);
                updateView();
            }
        }

        function switchStatTab(tab) {
            currentStatTab = tab;
            ['daily', 'weekly', 'monthly', 'yearly'].forEach(t => {
                let btn = document.getElementById(`sbtn-${t}`);
                if (t === tab) {
                    btn.className = "bg-purple-600 text-white py-2 rounded-xl text-xs font-semibold shadow-sm transition";
                } else {
                    btn.className = "text-gray-500 py-2 rounded-xl text-xs font-semibold hover:bg-white transition";
                }
            });
            updateView();
        }

        function isInRange(targetDate, baseDate, mode) {
            if (mode === 'daily') {
                return formatDateKey(targetDate) === formatDateKey(baseDate);
            } else if (mode === 'weekly') {
                let startOfWeek = new Date(baseDate);
                startOfWeek.setDate(baseDate.getDate() - baseDate.getDay() + (baseDate.getDay() === 0 ? -6 : 1));
                let endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6);
                return targetDate >= startOfWeek && targetDate <= endOfWeek;
            } else if (mode === 'monthly') {
                return targetDate.getFullYear() === baseDate.getFullYear() && targetDate.getMonth() === baseDate.getMonth();
            } else if (mode === 'yearly') {
                return targetDate.getFullYear() === baseDate.getFullYear();
            }
            return false;
        }

        function loadStatData() {
            let workSec = 0, breakSec = 0;

            for (let i = 0; i < localStorage.length; i++) {
                let k = localStorage.key(i);
                if (k && k.startsWith('history_')) {
                    let dStr = k.replace('history_', '');
                    let d = new Date(dStr);
                    if (isInRange(d, currentDate, currentStatTab)) {
                        let val = JSON.parse(localStorage.getItem(k));
                        if (val) {
                            workSec += val.workSec || 0;
                            breakSec += val.breakSec || 0;
                        }
                    }
                }
            }

            let generalState = JSON.parse(localStorage.getItem('malika_state'));
            let todayDateObj = new Date();
            if (generalState && isInRange(todayDateObj, currentDate, currentStatTab)) {
                workSec += generalState.workSec || 0;
                breakSec += generalState.breakSec || 0;
            }

            document.getElementById('stat-active-users').innerText = "1 nafar";
            let totalActive = workSec + breakSec;
            let eff = totalActive > 0 ? Math.min(Math.floor((workSec / totalActive) * 100), 100) : 0;
            document.getElementById('stat-team-eff').innerText = `${eff}%`;

            let savedProfile = JSON.parse(localStorage.getItem('malika_profile'));
            if (savedProfile && savedProfile.name) {
                document.getElementById('user-name-display').innerText = savedProfile.name;
            }
        }

        updateView();
    </script>
</body>
</html>
