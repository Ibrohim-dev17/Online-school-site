<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>CyberCut - Video Editor</title>
  <style>
    /* Umumiy sozlamalar */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19; /* Studio qorong'u foni */
      font-family: monospace;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column; /* Ekranni tepa va pastga bo'lamiz */
      overflow: hidden;
    }

    /* ==========================================
       1. TEPA QISM (PLAYER VA MEDIA)
       ========================================== */
    .top-panel {
      flex: 1; /* Tepa qism qolgan joyni egallaydi */
      display: flex; /* Media va Player yonma-yon turishi uchun */
      border-bottom: 2px solid #1e293b;
    }

    /* Chap tomondagi fayllar bo'limi */
    .media-sidebar {
      width: 300px;
      background-color: #0f172a;
      border-right: 2px solid #1e293b;
      padding: 20px;
    }
    .import-box {
      border: 2px dashed #00f3ff;
      padding: 30px 10px;
      text-align: center;
      color: #00f3ff;
      cursor: pointer;
      text-shadow: 0 0 5px #00f3ff;
    }

    /* O'ng tomondagi Video Player */
    .video-player-container {
      flex: 1;
      background-color: #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .video-screen {
      width: 70%;
      height: 70%;
      background-color: #000;
      border: 2px solid #334155;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #64748b;
    }

    /* ==========================================
       2. PASTKI QISM (TIMELINE - VAXT O'QI)
       ========================================== */
    .timeline-panel {
      height: 250px; /* Pastki montaj maydonining bo'yi */
      background-color: #0f172a;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .timeline-controls {
      display: flex;
      gap: 15px;
      align-items: center;
    }
    
    /* Neon Montaj Tugmalari */
    .editor-btn {
      background: transparent;
      border: 1px solid #00f3ff;
      color: #00f3ff;
      padding: 6px 15px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .editor-btn:active {
      transform: scale(0.9);
      box-shadow: 0 0 15px #00f3ff;
    }

    /* Treklarning ota qutisi */
    .tracks-container {
      flex: 1;
      background-color: #020617;
      border: 1px solid #1e293b;
      position: relative; /* Ichidagi vaqt chizig'ini erkin harakatlantirish uchun */
      overflow: hidden;
      padding: 10px 0;
    }

    /* Video suriladigan yo'lak (Track) */
    .video-track {
      width: 100%;
      height: 50px;
      background-color: #1e293b;
      margin-bottom: 10px;
      position: relative;
    }

    /* ERKIN JOYLASHTIRISH: Video bo'lagi (Klip) */
    .video-clip {
      position: absolute;
      /* Erkin koordinatalar orqali klipni xohlagan vaqtga surib qo'yamiz: */
      left: 150px; 
      top: 5px;
      
      width: 200px;
      height: 40px;
      background: linear-gradient(90deg, #00f3ff, #0055ff);
      border-radius: 5px;
      color: #020617;
      font-weight: bold;
      display: flex;
      align-items: center;
      padding-left: 10px;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
    }

    /* @keyframes O'chib-yonuvchi qizil chiziq (Playhead) */
    @keyframes neon-pulse {
      0%, 100% { box-shadow: 0 0 5px #ff0055; }
      50% { box-shadow: 0 0 15px #ff0055, 0 0 25px #ff0055; }
    }

    /* ERKIN JOYLASHTIRISH: Videoni qayeri ketayotganini ko'rsatuvchi marker (Playhead) */
    .playhead {
      position: absolute;
      top: 0;
      left: 280px; /* Vaqt bo'yicha joriy holat */
      
      width: 2px;
      height: 100%;
      background-color: #ff0055;
      z-index: 10;
      animation: neon-pulse 1.5s infinite;
    }
  </style>
</head>
<body>

  <div class="top-panel">
    <div class="media-sidebar">
      <h3 style="margin-bottom: 15px; color: #64748b;">MEDIA OMBORI</h3>
      <div class="import-box">
        + VlDEO YUKLASH
      </div>
    </div>
    
    <div class="video-player-container">
      <div class="video-screen">
        [ PLEYER: 00:00:00 ]
      </div>
    </div>
  </div>

  <div class="timeline-panel">
    
    <div class="timeline-controls">
      <button class="editor-btn">▶ PLAY</button>
      <button class="editor-btn" style="border-color: #ff0055; color: #ff0055;">✂ KESISH (SPLIT)</button>
      <button class="editor-btn" style="border-color: orange; color: orange;">🎵 AUDIO</button>
    </div>

    <div class="tracks-container">
      
      <div class="playhead"></div>

      <div class="video-track">
        <div class="video-clip">
          🎬 kiber_video.mp4
        </div>
      </div>
      
    </div>
  </div>

</body>
</html>
