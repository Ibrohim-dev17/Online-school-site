<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BilimGo - Welcome</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { background-color: #0f1026; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 420px; height: 100vh; max-height: 900px; background-color: #0f1026; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; position: relative; overflow-y: auto; }
        .content { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; }
        .logo-box { width: 100px; height: 100px; background: linear-gradient(135deg, #8b5cf6, #ec4899); border-radius: 30px; display: flex; justify-content: center; align-items: center; box-shadow: 0 15px 35px rgba(139, 92, 246, 0.4); margin-bottom: 24px; }
        .logo-box svg { width: 50px; height: 50px; fill: #ffffff; }
        h1 { font-size: 34px; font-weight: 800; margin-bottom: 8px; color: #ffffff; }
        p { color: #9ca3af; font-size: 16px; line-height: 1.5; margin-bottom: 40px; }
        .btn-primary { background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); color: white; border: none; width: 100%; padding: 18px; border-radius: 20px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 25px rgba(124, 58, 237, 0.4); text-decoration: none; display: block; text-align: center; transition: transform 0.2s; }
        .btn-primary:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="app-container">
        <div></div>
        <div class="content">
            <div class="logo-box">
                <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </div>
            <h1>BilimGo</h1>
            <p>Learn English.<br>Level up your future.</p>
            <a href="home.html" class="btn-primary">Get Started</a>
        </div>
        <div></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        });
    </script>
</body>
</html>
