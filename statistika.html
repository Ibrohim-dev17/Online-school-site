<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chevarxona Pro - Statistika</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between pb-24">

    <!-- Top Header -->
    <header class="p-4 mt-12 bg-white shadow-sm flex justify-between items-center sticky top-12 z-40">
        <h1 class="font-bold text-gray-800 text-base">Statistika</h1>
        <span class="text-xs text-purple-600 font-semibold bg-purple-50 px-2.5 py-1 rounded-lg">Bugungi ko'rsatkichlar</span>
    </header>

    <!-- Main Content -->
    <main class="p-4 space-y-4 max-w-xl mx-auto w-full">
        <!-- Umumiy hisobot kartalari -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <div class="text-purple-600 mb-2"><i class="fa-regular fa-clock text-lg"></i></div>
                <p class="text-xs text-gray-400">Jami ish vaqti</p>
                <h4 class="text-base font-bold text-gray-800" id="stat-work-time">0 soat 0 daqiqa</h4>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <div class="text-emerald-600 mb-2"><i class="fa-solid fa-chart-line text-lg"></i></div>
                <p class="text-xs text-gray-400">O'rtacha samaradorlik</p>
                <h4 class="text-base font-bold text-emerald-600" id="stat-efficiency">0%</h4>
            </div>
        </div>

        <!-- Grafik bo'limi (Vizual ko'rinish) -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-gray-700 text-sm">Soatlar bo'yicha faollik</h3>
                <span class="text-xs text-purple-600 font-semibold">Jonli</span>
            </div>
            <div class="h-32 flex items-end justify-between gap-1 pt-4 px-2 bg-gray-50 rounded-xl" id="chart-bars">
                <!-- Dinamik ustunlar -->
                <div class="w-full bg-purple-200 rounded-t-md h-10"></div>
                <div class="w-full bg-purple-300 rounded-t-md h-16"></div>
                <div class="w-full bg-purple-400 rounded-t-md h-24"></div>
                <div class="w-full bg-purple-600 rounded-t-md h-full" id="active-bar"></div>
                <div class="w-full bg-purple-300 rounded-t-md h-20"></div>
                <div class="w-full bg-purple-200 rounded-t-md h-12"></div>
            </div>
            <div class="flex justify-between text-[10px] text-gray-400 px-1">
                <span>08:00</span>
                <span>10:00</span>
                <span>12:00</span>
                <span>14:00</span>
                <span>16:00</span>
                <span>18:00</span>
            </div>
        </div>

        <!-- Qo'shimcha ma'lumot -->
        <div class="bg-purple-50 border border-purple-100 p-4 rounded-2xl flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-purple-600 text-white flex items-center justify-center">
                    <i class="fa-solid fa-award text-lg"></i>
                </div>
                <div>
                    <h4 class="font-bold text-purple-900 text-sm">Zo'r ishlayapsiz!</h4>
                    <p class="text-xs text-purple-600">Bugungi reja muvaffaqiyatli bajarilmoqda</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 px-2 z-50">
        <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600"><i class="fa-solid fa-house text-lg"></i><span class="text-xs mt-1">Asosiy</span></a>
        <a href="tarix.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600"><i class="fa-solid fa-user-gear text-lg"></i><span class="text-xs mt-1">Mening tarixim</span></a>
        <a href="statistika.html" class="flex flex-col items-center text-purple-600"><i class="fa-solid fa-chart-simple text-lg"></i><span class="text-xs mt-1 font-medium">Statistika</span></a>
        <a href="profil.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600"><i class="fa-solid fa-gear text-lg"></i><span class="text-xs mt-1">Sozlamalar</span></a>
    </nav>

    <script>
        let state = JSON.parse(localStorage.getItem('malika_state')) || { workSec: 0 };
        
        function formatTime(s) {
            let h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
            return h > 0 ? `${h} soat ${m} daqiqa` : `${m} daqiqa`;
        }

        document.getElementById('stat-work-time').innerText = formatTime(state.workSec);
        let eff = Math.min(Math.floor((state.workSec / (8 * 3600)) * 100), 100);
        document.getElementById('stat-efficiency').innerText = `${eff}%`;
    </script>
</body>
</html>
