<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chevarxona Pro - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f4f5f9; }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between pb-20">

    <!-- Header -->
    <header class="px-4 py-3 bg-white shadow-sm flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 bg-purple-600 rounded-xl flex items-center justify-center text-white font-bold shadow-md shadow-purple-200">CH</div>
            <div>
                <h1 class="font-bold text-gray-800 text-xs">Xush kelibsiz, Admin! 👋</h1>
                <p class="text-[10px] text-gray-400">Chevarxona faoliyati nazorati</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span class="px-2 py-1 bg-purple-50 text-purple-600 rounded-lg text-[10px] font-bold" id="current-date">-- -- ----</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-4 space-y-4 flex-1">
        
        <!-- Statistika kartochkalari -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm">
                <p class="text-[10px] text-gray-400 font-medium">Jami ishchilar</p>
                <h3 id="dash-workers-count" class="text-xl font-bold text-gray-800 mt-1">0</h3>
            </div>
            <div class="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm">
                <p class="text-[10px] text-gray-400 font-medium">Tizim holati</p>
                <h3 class="text-xl font-bold text-emerald-600 mt-1">Faol</h3>
            </div>
        </div>

        <!-- So'nggi ish faoliyati jadvali -->
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm space-y-3">
            <div class="flex items-center justify-between">
                <h3 class="text-xs font-bold text-gray-800">So'nggi ish faoliyati</h3>
                <span class="text-[10px] text-purple-600 font-semibold">Real-time</span>
            </div>
            <div id="dash-workers-table" class="space-y-2">
                <!-- Dinamik to'ldiriladi -->
            </div>
        </div>

    </main>

    <!-- Bottom Navigation (Telefon uchun pastki menyu) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around py-2.5 px-1 z-50 shadow-lg">
        <a href="admindashboard.html" class="flex flex-col items-center text-purple-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
            <span class="text-[9px] mt-1 font-semibold">Dashboard</span>
        </a>
        <a href="adminishchilar.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"/></svg>
            <span class="text-[9px] mt-1">Ishchilar</span>
        </a>
        <a href="statistika.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/></svg>
            <span class="text-[9px] mt-1">Statistika</span>
        </a>
        <a href="adminsetting.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a6.932 6.932 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.37.491l-1.216-.456c-.356-.133-.751-.072-1.076.124-.072.044-.146.087-.22.128-.332.183-.582.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.043.146-.087.22-.128.332-.183.582-.495.644-.869l-.214-1.281Z"/></svg>
            <span class="text-[9px] mt-1">Sozlamalar</span>
        </a>
    </nav>

    <script>
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('uz-UZ');
        
        const workers = JSON.parse(localStorage.getItem('chevarxona_workers')) || [];
        document.getElementById('dash-workers-count').innerText = workers.length;

        const tableContainer = document.getElementById('dash-workers-table');
        if (workers.length === 0) {
            tableContainer.innerHTML = `<p class="text-[11px] text-gray-400 py-2">Hozircha ishchilar mavjud emas.</p>`;
        } else {
            tableContainer.innerHTML = workers.map(w => `
                <div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-xl border border-gray-100">
                    <div>
                        <h4 class="font-bold text-gray-800 text-xs">${w.name}</h4>
                        <p class="text-[10px] text-gray-400">Login: ${w.login}</p>
                    </div>
                    <span class="px-2 py-0.5 bg-emerald-50 text-emerald-600 rounded-md text-[10px] font-bold">Faol</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
