<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chevarxona Pro - Profil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between pb-24">

    <!-- Top Header -->
    <header class="px-4 pt-12 pb-3 bg-white shadow-sm flex items-center justify-between sticky top-0 z-40">
        <h1 class="font-bold text-gray-800 text-base">Mening profilim</h1>
        <span class="text-xs font-semibold bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-xl flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Faol
        </span>
    </header>

    <!-- Main Content (Barcha qismlar yuqoriga ko'tarildi, pastda bo'sh joy qoldirildi) -->
    <main class="p-3 space-y-3 max-w-xl mx-auto w-full">
        <!-- Avatar va ma'lumotlar kartasi -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
            <div class="flex items-center gap-3.5">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=200" alt="Avatar" class="w-14 h-14 rounded-2xl object-cover border-2 border-purple-100">
                <div>
                    <h3 class="font-bold text-gray-800 text-sm" id="profile-name">Malika Abdullayeva</h3>
                    <p class="text-[11px] text-gray-400 mt-0.5">ID: 1025</p>
                    <p class="text-[11px] font-medium text-purple-600 mt-0.5">Chevar, 1-sektor</p>
                </div>
            </div>
            <!-- Tahrirlash tugmasi (SVG) -->
            <button onclick="openEditModal()" class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 hover:bg-purple-100 flex items-center justify-center transition shadow-sm" title="Tahrirlash">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                </svg>
            </button>
        </div>

        <!-- BU OY NATIJALARI (Yuqoriga ko'tarildi) -->
        <div class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h4 class="font-bold text-gray-800 text-xs">Bu oy natijalari</h4>
                <span class="text-purple-600 text-[11px] font-semibold" id="current-month-label">Iyul, 2026</span>
            </div>

            <!-- 4 ta natija kartalari -->
            <div class="grid grid-cols-2 gap-2.5">
                <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
                    <div class="text-purple-600 mb-1.5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"/></svg>
                    </div>
                    <p class="text-[10px] text-gray-400">Ish soatlari</p>
                    <h5 class="text-xs font-bold text-gray-800" id="res-work-hours">0 soat</h5>
                </div>
                <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
                    <div class="text-purple-600 mb-1.5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                    </div>
                    <p class="text-[10px] text-gray-400">O'rtacha kunlik</p>
                    <h5 class="text-xs font-bold text-gray-800" id="res-avg-hours">0 soat</h5>
                </div>
                <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
                    <div class="text-emerald-500 mb-1.5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                    </div>
                    <p class="text-[10px] text-gray-400">Kelgan kunlar</p>
                    <h5 class="text-xs font-bold text-gray-800" id="res-days-count">0 kun</h5>
                </div>
                <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
                    <div class="text-rose-500 mb-1.5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/></svg>
                    </div>
                    <p class="text-[10px] text-gray-400">Kechikishlar</p>
                    <h5 class="text-xs font-bold text-gray-800" id="res-lates-count">0 marta</h5>
                </div>
            </div>
        </div>

        <!-- Tahrirlash oynasi (Modal) -->
        <div id="edit-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl p-4 w-full max-w-sm space-y-3 shadow-lg">
                <div class="flex justify-between items-center">
                    <h5 class="font-bold text-xs text-gray-800">Ma'lumotlarni tahrirlash</h5>
                    <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600">✕</button>
                </div>
                <div class="space-y-2">
                    <div>
                        <label class="text-[10px] text-gray-400">Ism familiya</label>
                        <input type="text" id="edit-name" value="Malika Abdullayeva" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs font-semibold text-gray-800 focus:outline-none focus:border-purple-500">
                    </div>
                    <button onclick="saveProfile()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2.5 rounded-xl text-xs font-semibold transition shadow-sm">Saqlash</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 px-2 z-50">
        <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
            <span class="text-[10px] mt-1">Asosiy</span>
        </a>
        <a href="tarix.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
            <span class="text-[10px] mt-1">Mening tarixim</span>
        </a>
        <a href="statistika.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/></svg>
            <span class="text-[10px] mt-1">Statistika</span>
        </a>
        <a href="profil.html" class="flex flex-col items-center text-purple-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/></svg>
            <span class="text-[10px] mt-1 font-medium">Profil</span>
        </a>
    </nav>

    <script>
        function openEditModal() {
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        function saveProfile() {
            let name = document.getElementById('edit-name').value;
            if (name) {
                document.getElementById('profile-name').innerText = name;
                localStorage.setItem('malika_profile', JSON.stringify({ name: name }));
                closeEditModal();
            }
        }

        function loadMonthlyStats() {
            let totalWorkSec = 0;
            let daysCount = 0;
            let latesCount = 0;

            let now = new Date();
            let currentYear = now.getFullYear();
            let currentMonth = now.getMonth();

            for (let i = 0; i < localStorage.length; i++) {
                let k = localStorage.key(i);
                if (k && k.startsWith('history_')) {
                    let dStr = k.replace('history_', '');
                    let d = new Date(dStr);
                    if (d.getFullYear() === currentYear && d.getMonth() === currentMonth) {
                        let val = JSON.parse(localStorage.getItem(k));
                        if (val) {
                            let wSec = val.workSec || 0;
                            totalWorkSec += wSec;
                            if (wSec > 0) daysCount++;
                        }
                    }
                }
            }

            let generalState = JSON.parse(localStorage.getItem('malika_state'));
            if (generalState) {
                totalWorkSec += generalState.workSec || 0;
                if ((generalState.workSec || 0) > 0) {
                    daysCount = Math.max(1, daysCount);
                }
            }

            let totalHours = (totalWorkSec / 3600).toFixed(1);
            let avgHours = daysCount > 0 ? (totalWorkSec / 3600 / daysCount).toFixed(1) : "0";

            document.getElementById('res-work-hours').innerText = `${totalHours} soat`;
            document.getElementById('res-avg-hours').innerText = `${avgHours} soat`;
            document.getElementById('res-days-count').innerText = `${daysCount} kun`;
            document.getElementById('res-lates-count').innerText = `${latesCount} marta`;
        }

        let saved = JSON.parse(localStorage.getItem('malika_profile'));
        if (saved && saved.name) {
            document.getElementById('profile-name').innerText = saved.name;
            document.getElementById('edit-name').value = saved.name;
        }

        loadMonthlyStats();
    </script>
</body>
</html>
