<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            width: 90%;
            max-width: 400px;
        }

        /* Ilovalar ro'yxati (Tugmalar majmuasi) */
        .apps-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        /* Minimalist noutbuk/kiberpank uslubidagi tugma */
        .app-btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            text-align: center;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.25s ease;
        }

        .app-btn:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        /* Kelajakda qo'shiladigan ilovalar uchun xira tugma dizayni */
        .disabled-btn {
            border: 1px dashed #444;
            color: #444;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="apps-grid">
            <a href="time.html" class="app-btn">Vaqt & Taymer</a>
            <a href="note.html" class="app-btn">Bloknot (Notes)</a>
            
            <a href="#" class="app-btn disabled-btn">Yaqinda...</a>
        </div>
    </div>

</body>
</html>
