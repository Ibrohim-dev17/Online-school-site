<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Mafia - Ultra Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;600&display=swap');
        .mafia-font { font-family: 'Cinzel', serif; }
        .body-font { font-family: 'Poppins', sans-serif; }
        
        .card-flip { perspective: 1000px; }
        .card-inner {
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        .flipped { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; }
        .card-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 body-font min-h-screen p-4 flex flex-col justify-between">

    <header class="text-center py-4 border-b border-red-900/30">
        <h1 class="text-3xl font-bold tracking-widest text-red-600 mafia-font">ELITE MAFIA</h1>
        <p id="player-name" class="text-xs text-gray-400 mt-1">Sizga qaysi rol tushar ekan?</p>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center my-6">
        
        <div class="card-flip w-64 h-96 cursor-pointer" onclick="revealRole()">
            <div id="mafiaCard" class="card-inner w-full h-full relative">
                
                <div class="card-front absolute w-full h-full border-2 border-red-700 rounded-3xl shadow-2xl flex flex-col items-center justify-center p-6 text-center bg-cover bg-center" 
                     style="background-image: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(15,0,0,0.9)), url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&q=80&w=600');">
                    <div class="w-16 h-16 bg-red-600/20 rounded-full flex items-center justify-center border border-red-600 mb-4">
                        <span class="text-red-500 text-3xl font-bold mafia-font">M</span>
                    </div>
                    <h3 class="text-xl font-bold text-red-500 mafia-font tracking-wide">KARTANI OCHISH</h3>
                    <p class="text-[11px] text-gray-400 mt-2 px-4">Rolingizni ko'rish uchun bosing</p>
                </div>

                <div id="cardBackView" class="card-back absolute w-full h-full border-2 rounded-3xl shadow-2xl flex flex-col justify-between overflow-hidden bg-cover bg-center">
                    
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-black/70 z-0"></div>

                    <div class="z-10 p-5 flex flex-col h-full justify-between text-center">
                        <div>
                            <span id="roleBadge" class="text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded-full text-white">Mafia</span>
                        </div>
                        
                        <div class="mb-2">
                            <h2 id="roleTitle" class="text-2xl font-bold mafia-font text-white tracking-wide">MAFIYA</h2>
                            <p id="roleDesc" class="text-xs text-gray-200 mt-2 leading-relaxed bg-black/50 p-2 rounded-xl backdrop-blur-sm">Tunda shaharni yo'q qiling, kunduzi esa o'zingizni yashiring.</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <footer class="bg-gray-900/50 border border-gray-800 p-4 rounded-2xl backdrop-blur-md">
        <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-semibold text-gray-400">O'yin holati:</span>
            <span class="bg-red-600/20 text-red-400 text-[10px] px-2 py-0.5 rounded font-bold uppercase">Karta bosqichi</span>
        </div>
        <p class="text-center text-xs text-gray-500">Guruhdagi boshqa o'yinchilar kartalarini ochishmoqda...</p>
    </footer>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#030712';

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('player-name').innerText = `O'yinchi: ${tg.initDataUnsafe.user.first_name}`;
        }

        // Haqiqiy atmosferik rasmlar bazasi (Unsplash portretlari)
        const roles = [
            {
                title: "MAFIYA",
                badge: "Mafia",
                // Qorong'u ko'chadagi sirli kishi rasmi
                img: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=600",
                desc: "Tunda sheriklaringiz bilan birga kimnidir qurbon qiling, kunduzi gumonlarni boshqalarga buring.",
                border: "border-red-600",
                badgeBg: "bg-red-600"
            },
            {
                title: "KOMISSAR",
                badge: "Civil",
                // Detektiv uslubidagi rasm
                img: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&q=80&w=600",
                desc: "Shaharning haqiqiy himoyachisi. Har tunda bir marta o'yinchilarning roylini yashirincha tekshiring.",
                border: "border-blue-600",
                badgeBg: "bg-blue-600"
            },
            {
                title: "DOKTOR",
                badge: "Civil",
                // Shifokor / jiddiy qiyofadagi rasm
                img: "https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&q=80&w=600",
                desc: "Insonlar hayotini saqlab qoluvchi shaxs. Har tunda bir kishini mafiya o'qidan davolang.",
                border: "border-green-600",
                badgeBg: "bg-green-600"
            },
            {
                title: "TINCH AHOLI",
                badge: "Civil",
                // Oddiy shahar fuqarosi portreti
                img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=600",
                desc: "Sizda maxsus kuch yo'q, lekin sizning ovozingiz qurolingizdir. Mafiyalarni suhbatda fosh qiling.",
                border: "border-slate-500",
                badgeBg: "bg-slate-600"
            }
        ];

        let isFlipped = false;

        function revealRole() {
            const card = document.getElementById('mafiaCard');
            const cardBackView = document.getElementById('cardBackView');
            
            if (!isFlipped) {
                const randomRole = roles[Math.floor(Math.random() * roles.length)];
                
                // Rasm va stilni o'rnatish
                cardBackView.style.backgroundImage = `url('${randomRole.img}')`;
                cardBackView.className = `card-back absolute w-full h-full border-2 rounded-3xl shadow-2xl flex flex-col justify-between overflow-hidden bg-cover bg-center ${randomRole.border}`;
                
                document.getElementById('roleBadge').innerText = randomRole.badge;
                document.getElementById('roleBadge').className = `text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded-full text-white ${randomRole.badgeBg}`;
                document.getElementById('roleTitle').innerText = randomRole.title;
                document.getElementById('roleDesc').innerText = randomRole.desc;

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }

                card.classList.add('flipped');
                isFlipped = true;
            } else {
                card.classList.remove('flipped');
                isFlipped = false;
            }
        }
    </script>
</body>
</html>
