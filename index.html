<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katta Raqamli Soat & Taymer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        /* Asosiy konteyner: ekran yo'nalishiga qarab o'zgaradi */
        .container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            height: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        /* Vertikal holat uchun (Ekran kengligi kichik bo'lsa) */
        @media (max-width: 768px) or (orientation: portrait) {
            .container {
                flex-direction: column;
                justify-content: center;
                gap: 40px;
            }
            .clock-display {
                font-size: 18vw !important; /* Ekran kengligiga qarab moslashadi */
            }
            .sidebar {
                flex-direction: row !important;
                flex-wrap: wrap;
                justify-content: center;
                width: 100% !important;
            }
        }

        /* Soat joylashgan qism */
        .main-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .clock-display {
            font-size: 10vw; /* Gorizontalda ulkan hajm */
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1;
        }

        .mode-title {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
            color: #888;
        }

        /* Yon paneldagi tugmalar (Gorizontalda tikkasiga, vertikalda yondosh) */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 220px;
            justify-content: center;
        }

        .btn {
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }

        .btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn.active {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        /* Boshqaruv tugmalari (Start, Stop, Reset) faqat kerak bo'lganda chiqadi */
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .control-btn:hover {
            background: #333;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="main-display">
            <div id="modeTitle" class="mode-title">Hozirgi Vaqt</div>
            <div id="clockDisplay" class="clock-display">00:00:00</div>
            
            <div id="controlPanel" class="controls hidden">
                <button class="control-btn" id="startStopBtn" onclick="toggleRun()">Start</button>
                <button class="control-btn" onclick="resetMode()">Reset</button>
            </div>
        </div>

        <div class="sidebar">
            <button class="btn active" id="btn-clock" onclick="switchMode('clock')">Soat</button>
            <button class="btn" id="btn-pomodoro" onclick="switchMode('pomodoro')">Pomodoro</button>
            <button class="btn" id="btn-stopwatch" onclick="switchMode('stopwatch')">Sekundomer</button>
            <button class="btn" id="btn-timer" onclick="switchMode('timer')">Taymer (5 m)</button>
        </div>

    </div>

    <script>
        let currentMode = 'clock'; // clock, pomodoro, stopwatch, timer
        let timerInterval = null;
        
        // Rejim o'zgaruvchilari
        let timeRemaining = 0; // soniyalarda
        let stopwatchTime = 0; // millisekundlarda yoki soniyada
        let isRunning = false;

        // Har soniyada ekranni yangilab turish
        setInterval(() => {
            if (currentMode === 'clock') {
                updateClock();
            }
        }, 1000);

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clockDisplay').innerText = `${hours}:${minutes}:${seconds}`;
        }

        // Dastlabki ishga tushirish
        updateClock();

        function switchMode(mode) {
            clearInterval(timerInterval);
            isRunning = false;
            currentMode = mode;
            
            // Faol tugmani belgilash
            document.querySelectorAll('.sidebar .btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');

            const controlPanel = document.getElementById('controlPanel');
            const startStopBtn = document.getElementById('startStopBtn');
            startStopBtn.innerText = 'Start';

            if (mode === 'clock') {
                document.getElementById('modeTitle').innerText = 'Hozirgi Vaqt';
                controlPanel.classList.add('hidden');
                updateClock();
            } 
            else if (mode === 'pomodoro') {
                document.getElementById('modeTitle').innerText = 'Pomodoro (25 min)';
                controlPanel.classList.remove('hidden');
                timeRemaining = 25 * 60;
                displayLeftTime();
            } 
            else if (mode === 'stopwatch') {
                document.getElementById('modeTitle').innerText = 'Sekundomer';
                controlPanel.classList.remove('hidden');
                stopwatchTime = 0;
                document.getElementById('clockDisplay').innerText = '00:00.00';
            } 
            else if (mode === 'timer') {
                document.getElementById('modeTitle').innerText = 'Taymer';
                controlPanel.classList.remove('hidden');
                timeRemaining = 5 * 60; // Standart 5 daqiqa
                displayLeftTime();
            }
        }

        function toggleRun() {
            const startStopBtn = document.getElementById('startStopBtn');
            if (isRunning) {
                clearInterval(timerInterval);
                startStopBtn.innerText = 'Start';
                isRunning = false;
            } else {
                startStopBtn.innerText = 'Stop';
                isRunning = true;

                if (currentMode === 'pomodoro' || currentMode === 'timer') {
                    timerInterval = setInterval(() => {
                        if (timeRemaining > 0) {
                            timeRemaining--;
                            displayLeftTime();
                        } else {
                            clearInterval(timerInterval);
                            alert('Vaqt tugadi!');
                            resetMode();
                        }
                    }, 1000);
                } else if (currentMode === 'stopwatch') {
                    let startTime = Date.now() - stopwatchTime;
                    timerInterval = setInterval(() => {
                        stopwatchTime = Date.now() - startTime;
                        displayStopwatch();
                    }, 10);
                }
            }
        }

        function resetMode() {
            switchMode(currentMode);
        }

        function displayLeftTime() {
            const minutes = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
            const seconds = String(timeRemaining % 60).padStart(2, '0');
            document.getElementById('clockDisplay').innerText = `${minutes}:${seconds}`;
        }

        function displayStopwatch() {
            const totalSeconds = Math.floor(stopwatchTime / 1000);
            const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            const milliseconds = String(Math.floor((stopwatchTime % 1000) / 10)).padStart(2, '0');
            document.getElementById('clockDisplay').innerText = `${minutes}:${seconds}.${milliseconds}`;
        }
    </script>
</body>
</html>
