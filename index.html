<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Social</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg: #09090b; --card: #18181b; --accent: #8b5cf6; --text: #fafafa; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; }
        
        .feed { padding: 15px; }
        .post { background: var(--card); border-radius: 20px; padding: 15px; margin-bottom: 20px; border: 1px solid #27272a; }
        .media-box { width: 100%; height: 300px; background: #27272a; border-radius: 15px; display: flex; align-items: center; justify-content: center; margin: 10px 0; }
        
        .actions { display: flex; gap: 15px; align-items: center; margin-top: 10px; }
        .btn-icon { background: none; border: none; color: white; cursor: pointer; padding: 5px; }
        
        .navbar { position: fixed; bottom: 0; width: 100%; background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #27272a; }
        
        #fileInput { display: none; }
    </style>
</head>
<body>

<div class="feed" id="feed">
    <!-- Post namunasi -->
    <div class="post">
        <div style="font-weight: bold; margin-bottom: 10px;">@username</div>
        <div class="media-box">Rasm/Video</div>
        <div class="actions">
            <button class="btn-icon" onclick="toggleLike(this)"><i data-lucide="heart"></i></button>
            <button class="btn-icon"><i data-lucide="message-circle"></i></button>
            <button class="btn-icon"><i data-lucide="send"></i></button>
        </div>
        <input type="text" placeholder="Izoh yozish..." style="width: 90%; background: transparent; border: none; color: white; margin-top: 10px;">
    </div>
</div>

<div class="navbar">
    <button class="btn-icon"><i data-lucide="home"></i></button>
    <button class="btn-icon"><i data-lucide="search"></i></button>
    <button class="btn-icon" onclick="document.getElementById('fileInput').click()"><i data-lucide="plus-square"></i></button>
    <button class="btn-icon"><i data-lucide="user"></i></button>
</div>

<input type="file" id="fileInput" accept="image/*,video/*" onchange="uploadFile(event)">

<script>
    // Ikonkalarni ishga tushirish
    lucide.createIcons();

    function toggleLike(btn) {
        btn.style.color = btn.style.color === 'red' ? 'white' : 'red';
    }

    function uploadFile(event) {
        const file = event.target.files[0];
        if (file) {
            alert(file.name + " yuklanmoqda...");
            // Bu yerda Supabase storage-ga yuklash kodlari bo'ladi
        }
    }
</script>
</body>
</html>
