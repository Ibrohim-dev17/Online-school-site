<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Stream</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
            --accent: #ff3e3e; /* Instagram rangidan farqli (qizil emas, balki neon) */
            --text: #f0f0f0;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding-bottom: 80px; 
        }

        /* Kartochkalar uslubi (Instagramdan farqli) */
        .feed-container { padding: 20px; }
        .card { 
            background: var(--glass); 
            backdrop-filter: blur(15px);
            border-radius: 25px; 
            margin-bottom: 30px; 
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .video-box { height: 400px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; }
        
        .card-footer { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        .btn-action { 
            background: none; border: none; color: white; font-size: 20px; cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-action:active { transform: scale(1.3); }

        /* Navbar (Futuristik) */
        .navbar { 
            position: fixed; bottom: 20px; left: 20px; right: 20px; 
            background: rgba(20, 20, 20, 0.8); 
            backdrop-filter: blur(20px);
            border-radius: 30px; padding: 15px;
            display: flex; justify-content: space-around;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

<div class="feed-container">
    <!-- Post -->
    <div class="card">
        <div class="video-box">Video joyi</div>
        <div class="card-footer">
            <div>
                <b style="display:block">username</b>
                <small style="opacity: 0.6;">Tavsif matni...</small>
            </div>
            <div>
                <button class="btn-action">🤍</button>
                <button class="btn-action">💬</button>
            </div>
        </div>
    </div>
</div>

<div class="navbar">
    <button class="btn-action">🏠</button>
    <button class="btn-action">🔍</button>
    <button class="btn-action">➕</button>
    <button class="btn-action">👤</button>
</div>

</body>
</html>
