<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>BilimGo - Welcome</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0f1026; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .phone-container { width: 390px; height: 844px; background-color: #0f1026; border-radius: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; position: relative; border: 8px solid #2a2b4e; }
        .status-bar { display: flex; justify-content: space-between; padding: 14px 24px; font-size: 14px; font-weight: 600; }
        .content { flex: 1; overflow-y: auto; padding: 0 24px 24px 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .btn-primary { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); color: white; border: none; width: 100%; padding: 16px; border-radius: 20px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4); }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
        <div class="content">
            <div style="background: linear-gradient(135deg, #8b5cf6, #ec4899); width: 90px; height: 90px; border-radius: 28px; display: flex; justify-content: center; align-items: center; box-shadow: 0 12px 30px rgba(139, 92, 246, 0.5); margin-bottom: 24px;">
                <span style="font-size: 42px;">⚡</span>
            </div>
            <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 8px;">BilimGo</h1>
            <p style="color: #9ca3af; font-size: 15px; margin-bottom: 40px;">Learn English.<br>Level up your future.</p>
            <a href="home.html" style="width: 100%; text-decoration: none;">
                <button class="btn-primary" id="startBtn">Get Started</button>
            </a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            console.log("Index sahifasi yuklandi");
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        });
    </script>
</body>
</html>
