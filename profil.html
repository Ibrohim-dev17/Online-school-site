<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chevarxona Pro - Profil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between pb-24">

    <!-- Top Header -->
    <header class="p-4 mt-12 bg-white shadow-sm flex justify-between items-center sticky top-12 z-40">
        <h1 class="font-bold text-gray-800 text-base">Mening profilim</h1>
        <a href="admin.html" class="text-xs bg-purple-50 text-purple-600 px-3 py-1 rounded-lg font-semibold">Admin Panel</a>
    </header>

    <!-- Main Content -->
    <main class="p-4 space-y-4 max-w-xl mx-auto w-full">
        <!-- Profil karta -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="w-14 h-14 rounded-full object-cover border-2 border-purple-500">
                <div>
                    <h3 class="font-bold text-gray-800 text-base">Malika Abdullayeva</h3>
                    <p class="text-xs text-gray-400">ID: 1025 • Chevar, 1-sektor</p>
                </div>
            </div>
            <span class="text-xs bg-emerald-100 text-emerald-600 px-2.5 py-1 rounded-full font-semibold">Faol</span>
        </div>

        <!-- Sozlamalar menyusi -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 divide-y divide-gray-100 overflow-hidden">
            <div class="p-4 flex items-center justify-between hover:bg-gray-50 cursor-pointer">
                <div class="flex items-center gap-3 text-gray-700">
                    <i class="fa-regular fa-bell text-purple-600"></i>
                    <span class="text-sm font-medium">Bildirishnomalar</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
            </div>
            <div class="p-4 flex items-center justify-between hover:bg-gray-50 cursor-pointer">
                <div class="flex items-center gap-3 text-gray-700">
                    <i class="fa-regular fa-circle-question text-purple-600"></i>
                    <span class="text-sm font-medium">Yordam va qo'llanma</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
            </div>
            <div class="p-4 flex items-center justify-between hover:bg-gray-50 cursor-pointer">
                <div class="flex items-center gap-3 text-gray-700">
                    <i class="fa-solid fa-circle-info text-purple-600"></i>
                    <span class="text-sm font-medium">Ilova haqida</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
            </div>
        </div>

        <!-- Chiqish tugmasi -->
        <button onclick="localStorage.clear(); alert('Ma\'lumotlar tozalandi!'); location.reload();" class="w-full bg-rose-50 text-rose-600 font-semibold py-3 rounded-2xl text-sm border border-rose-100 hover:bg-rose-100 transition">
            Ma'lumotlarni tozalash / Chiqish
        </button>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 px-2 z-50">
        <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600"><i class="fa-solid fa-house text-lg"></i><span class="text-xs mt-1">Asosiy</span></a>
        <a href="tarix.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600"><i class="fa-solid fa-user-gear text-lg"></i><span class="text-xs mt-1">Mening tarixim</span></a>
        <a href="statistika.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600"><i class="fa-solid fa-chart-simple text-lg"></i><span class="text-xs mt-1">Statistika</span></a>
        <a href="profil.html" class="flex flex-col items-center text-purple-600"><i class="fa-solid fa-gear text-lg"></i><span class="text-xs mt-1 font-medium">Sozlamalar</span></a>
    </nav>

</body>
</html>
