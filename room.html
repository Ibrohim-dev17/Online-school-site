<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUE MAFIYA - Kutish Xonasi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap');
        .cyber-font { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-black text-white cyber-font min-h-screen flex flex-col justify-between p-4"
      style="background-image: linear-gradient(to bottom, rgba(0,0,0,0.95), rgba(5,5,5,0.99)), url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&q=80&w=600'); background-size: cover; background-position: center;">

    <header class="bg-zinc-950/80 border border-zinc-900 p-4 rounded-2xl flex justify-between items-center">
        <div>
            <h2 id="displayRoomName" class="font-bold text-red-500 text-base">Xona Yuklanmoqda...</h2>
            <p class="text-[10px] text-zinc-400">O'yin boshlanishi kutilmoqda</p>
        </div>
        <span class="bg-green-500/10 text-green-400 text-xs px-2.5 py-1 rounded-xl border border-green-500/20 animate-pulse font-bold">7 / 15 Kishi</span>
    </header>

    <div class="grid grid-cols-2 gap-2 my-3">
        <button onclick="toggleSection('chatSection')" class="bg-zinc-950/80 border border-zinc-800 py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 hover:border-zinc-600 transition">
            💬 UMUMIY CHAT
        </button>
        <button onclick="toggleVoice()" id="voiceBtn" class="bg-zinc-950/80 border border-zinc-800 py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition">
            🎙 OVOZLI ALOQA: OFF
        </button>
    </div>

    <div id="chatSection" class="bg-zinc-950/90 border border-zinc-900 p-3 rounded-2xl h-44 flex flex-col justify-between mb-3">
        <div id="chatMessages" class="overflow-y-auto space-y-1.5 text-left text-xs flex-1 pr-1 text-zinc-300">
            <p><span class="text-red-500 font-bold">[Tizim]:</span> Xonaga xush kelibsiz. O'yindan oldin strategiyani kelishib oling!</p>
            <p><span class="text-zinc-500 font-bold">Ali:</span> Qatnashuvchilar ko'payib ketti, tezroq boshlaylik.</p>
            <p><span class="text-zinc-500 font-bold">Madina:</span> Men bu safar aniq tinch aholi bo'laman deb umid qilaman haha.</p>
        </div>
        <div class="flex gap-2 mt-2">
            <input id="chatInput" type="text" placeholder="Xabar yozing..." class="flex-1 bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl text-xs outline-none focus:border-zinc-600 text-white">
            <button onclick="sendMessage()" class="bg-red-700 hover:bg-red-600 px-4 rounded-xl text-xs font-bold transition">➡️</button>
        </div>
    </div>

    <main class="flex-1 overflow-y-auto mb-4 bg-zinc-950/40 border border-zinc-900/60 p-3 rounded-2xl">
        <h3 class="text-xs text-zinc-400 mb-2 uppercase tracking-wider font-semibold">Ulangan O'yinchilar:</h3>
        <div class="grid grid-cols-2 gap-2" id="playersList">
            </div>
    </main>

    <div>
        <button id="actionBtn" onclick="goToGame()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-4 rounded-2xl text-sm tracking-wide transition shadow-lg shadow-red-900/20">
            O'YINNI BOSHLASH
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        // Sahifa yuklanganda Localstorage'dan xona nomini o'qish
        const roomName = localStorage.getItem('currentRoomName') || "True Mafia Hall";
        const isAdmin = localStorage.getItem('isAdmin') === 'true';
        
        document.getElementById('displayRoomName').innerText = roomName;

        // Agar admin bo'lmasa, "O'yinni boshlash" tugmasini "Tayyorman" ga o'zgartiramiz
        const actionBtn = document.getElementById('actionBtn');
        if (!isAdmin) {
            actionBtn.innerText = "ADMIN BOSHLASHINI KUTISH";
            actionBtn.className = "w-full bg-zinc-800 text-zinc-500 font-bold py-4 rounded-2xl text-sm tracking-wide cursor-not-allowed";
            actionBtn.disabled = true;
        }

        // O'yinchilar ro'yxatini chiqarish
        const players = ['Siz (Admin)', 'Anvar', 'Jasur', 'Malika', 'Kamola', 'Rustam', 'Sardor'];
        const listContainer = document.getElementById('playersList');
        players.forEach((p, index) => {
            listContainer.innerHTML += `
                <div class="bg-zinc-950/80 p-3 rounded-xl border border-zinc-900 flex items-center justify-between">
                    <span class="text-xs truncate font-medium">${p}</span>
                    <span class="w-2 h-2 rounded-full ${index === 0 ? 'bg-green-500' : 'bg-green-500/60'}"></span>
                </div>`;
        });

        // Chat funksiyasi
        function sendMessage() {
            const input = document.getElementById('chatInput');
            if(!input.value.trim()) return;
            const msgBox = document.getElementById('chatMessages');
            msgBox.innerHTML += `<p><span class="text-red-400 font-bold">Siz:</span> ${input.value}</p>`;
            input.value = '';
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        // Ovozli aloqa simulyatsiyasi
        let voice = false;
        function toggleVoice() {
            voice = !voice;
            const btn = document.getElementById('voiceBtn');
            if(voice) {
                btn.className = "bg-green-950/80 border border-green-500 text-green-400 py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition";
                btn.innerText = "🎙 OVOZLI ALOQA: ON";
            } else {
                btn.className = "bg-zinc-950/80 border border-zinc-800 py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition";
                btn.innerText = "🎙 OVOZLI ALOQA: OFF";
            }
        }

        function toggleSection(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        function goToGame() {
            // Keyingi bosqichda haqiqiy o'yin maydoniga (game.html) o'tiladi
            alert("O'yin serveri yuklanmoqda... Rollar taqsimlanmoqda!");
        }
    </script>
</body>
</html>
