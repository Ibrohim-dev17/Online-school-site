<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chevarxona Pro - Ishchilar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between pb-24">

    <!-- Top Header -->
    <header class="px-4 py-3 bg-white shadow-sm flex items-center justify-between sticky top-0 z-50 w-full max-w-xl mx-auto border-b border-gray-100">
        <div class="flex items-center gap-3">
            <div class="relative">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100" class="w-10 h-10 rounded-full object-cover border border-purple-200" alt="Admin">
                <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white rounded-full"></span>
            </div>
            <div>
                <h1 class="font-bold text-gray-800 text-sm">Ishchilar bo‘limi</h1>
                <p class="text-[10px] text-purple-600 font-medium">Boshqaruv</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-4 space-y-4 max-w-xl mx-auto w-full flex-1">
        
        <!-- Yangi ishchi qo'shish formasi -->
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm space-y-3">
            <h3 class="text-xs font-bold text-gray-700 uppercase tracking-wider">Yangi ishchi qo‘shish</h3>
            <form onsubmit="addWorker(event)" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-medium text-gray-600 mb-1">Ishchining F.I.O</label>
                    <input type="text" id="worker-name" placeholder="Masalan: Malika Karimova" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs text-gray-800 focus:outline-none focus:border-purple-500 transition">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-gray-600 mb-1">Login (Kirish uchun)</label>
                    <input type="text" id="worker-login" placeholder="Masalan: malika" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs text-gray-800 focus:outline-none focus:border-purple-500 transition">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-gray-600 mb-1">Parol</label>
                    <input type="text" id="worker-pass" placeholder="Masalan: 1234" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs text-gray-800 focus:outline-none focus:border-purple-500 transition">
                </div>
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-2.5 rounded-xl text-xs transition shadow-sm">Ishchini qo‘shish</button>
            </form>
        </div>

        <!-- Mavjud ishchilar ro'yxati -->
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm space-y-3">
            <h3 class="text-xs font-bold text-gray-700 uppercase tracking-wider">Ro‘yxatdagi ishchilar</h3>
            <div id="workers-list" class="space-y-2">
                <!-- Dinamik qo'shiladi -->
            </div>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 px-2 z-50 max-w-xl mx-auto w-full">
        <a href="admindashboard.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
            <span class="text-[10px] mt-1">Asosiy</span>
        </a>
        <a href="adminishchilar.html" class="flex flex-col items-center text-purple-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"/></svg>
            <span class="text-[10px] mt-1 font-semibold">Ishchilar</span>
        </a>
        <a href="adminsetting.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a6.932 6.932 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.37.491l-1.216-.456c-.356-.133-.751-.072-1.076.124-.072.044-.146.087-.22.128-.332.183-.582.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.043.146-.087.22-.128.332-.183.582-.495.644-.869l-.214-1.281Z"/></svg>
            <span class="text-[10px] mt-1">Sozlamalar</span>
        </a>
    </nav>

    <script>
        function getWorkers() {
            return JSON.parse(localStorage.getItem('chevarxona_workers')) || [];
        }

        function renderWorkers() {
            const workers = getWorkers();
            const container = document.getElementById('workers-list');
            
            if (workers.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-400">Hozircha ishchilar qo‘shilmagan.</p>`;
                return;
            }

            container.innerHTML = workers.map((w, index) => `
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-100">
                    <div>
                        <h4 class="font-bold text-gray-800 text-xs">${w.name}</h4>
                        <p class="text-[10px] text-gray-400">Login: <span class="font-semibold text-purple-600">${w.login}</span> | Parol: <span class="font-semibold text-gray-600">${w.pass}</span></p>
                    </div>
                    <button onclick="deleteWorker(${index})" class="text-gray-400 hover:text-rose-500 p-1 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg>
                    </button>
                </div>
            `).join('');
        }

        function addWorker(e) {
            e.preventDefault();
            const name = document.getElementById('worker-name').value.trim();
            const login = document.getElementById('worker-login').value.trim();
            const pass = document.getElementById('worker-pass').value.trim();

            let workers = getWorkers();
            
            if (workers.some(w => w.login === login)) {
                alert("Bu login band! Boshqa login kiriting.");
                return;
            }

            workers.push({ name, login, pass });
            localStorage.setItem('chevarxona_workers', JSON.stringify(workers));

            document.getElementById('worker-name').value = '';
            document.getElementById('worker-login').value = '';
            document.getElementById('worker-pass').value = '';

            renderWorkers();
            alert("Ishchi muvaffaqiyatli qo‘shildi!");
        }

        function deleteWorker(index) {
            if (confirm("Haqiqatan ham bu ishchini o‘chirmoqchimisiz?")) {
                let workers = getWorkers();
                workers.splice(index, 1);
                localStorage.setItem('chevarxona_workers', JSON.stringify(workers));
                renderWorkers();
            }
        }

        renderWorkers();
    </script>
</body>
</html>
