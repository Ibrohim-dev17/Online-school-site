<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>BilimGo - Home</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0f1026; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .phone-container { width: 390px; height: 844px; background-color: #0f1026; border-radius: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; position: relative; border: 8px solid #2a2b4e; }
        .status-bar { display: flex; justify-content: space-between; padding: 14px 24px; font-size: 14px; font-weight: 600; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; }
        .content { flex: 1; overflow-y: auto; padding: 0 24px 24px 24px; }
        .content::-webkit-scrollbar { display: none; }
        .badge { background: #f59e0b; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .bottom-nav { display: flex; justify-content: space-around; background: #181938; padding: 14px 0; border-top: 1px solid rgba(255,255,255,0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6b7280; font-size: 11px; text-decoration: none; }
        .nav-item.active { color: #8b5cf6; }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
        <div class="header">
            <h2 style="font-size: 20px; font-weight: 800; color: #a78bfa;">BilimGo</h2>
            <div class="badge">⚡ 15/15</div>
        </div>
        <div class="content">
            <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 12px;">Kids Levels</h3>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px;">
                <div class="level-card" style="background: #181938; padding: 14px; border-radius: 16px; text-align: center; border: 1px solid #3b82f6; cursor: pointer;">
                    <span style="font-size: 28px;">🦖</span>
                    <p style="font-size: 12px; margin-top: 6px; font-weight: bold;">Kids 1</p>
                </div>
            </div>
            <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 12px;">Adult Levels</h3>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
                <a href="categories.html" style="text-decoration: none; color: inherit;">
                    <div style="background: #181938; padding: 16px; border-radius: 16px; text-align: center; font-weight: bold;">A1</div>
                </a>
            </div>
        </div>
        <div class="bottom-nav">
            <a href="home.html" class="nav-item active">🏠<span>Home</span></a>
            <a href="categories.html" class="nav-item">📚<span>Learn</span></a>
            <a href="#" class="nav-item">⚡<span>Challenges</span></a>
            <a href="profile.html" class="nav-item">👤<span>Profile</span></a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const cards = document.querySelectorAll('.level-card');
            cards.forEach(card => {
                card.addEventListener('click', () => {
                    alert("Kids darajalari tez kunda ochiladi!");
                });
            });
        });
    </script>
</body>
</html>
