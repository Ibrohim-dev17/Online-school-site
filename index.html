<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini Video Editor</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    video {
      width: 80%;
      max-width: 600px;
      margin-top: 20px;
      border: 2px solid #444;
      border-radius: 10px;
    }

    input {
      margin-top: 20px;
    }

    button {
      margin: 10px;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h1>🎬 Mini Video Editor</h1>

  <input type="file" id="upload" accept="video/*">

  <br>

  <video id="video" controls></video>

  <br>

  <button onclick="playVideo()">▶ Play</button>
  <button onclick="pauseVideo()">⏸ Pause</button>

  <script>
    const upload = document.getElementById("upload");
    const video = document.getElementById("video");

    upload.addEventListener("change", function() {
      const file = this.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        video.src = url;
      }
    });

    function playVideo() {
      video.play();
    }

    function pauseVideo() {
      video.pause();
    }
  </script>

</body>
</html>
