<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chevarxona - Ishchi Profili</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tap-effect { transition: transform 0.2s ease, opacity 0.2s ease; }
        .tap-effect:active { transform: scale(0.95); opacity: 0.8; }
        body { background-color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="text-slate-800 pb-10">

    <header class="px-5 pt-6 pb-3 bg-white shadow-sm flex items-center justify-between">
        <a href="ishchilar.html" class="tap-effect text-slate-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <h1 class="text-lg font-bold">Ishchi profili</h1>
        <div class="w-6"></div>
    </header>

    <main class="px-5 pt-4">
        <!-- ProfilCard -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between mb-4">
            <div class="flex items-center gap-3">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="w-14 h-14 rounded-full object-cover">
                <div>
                    <h3 class="font-bold text-slate-800">Malika Abdullayeva</h3>
                    <p class="text-xs text-slate-400">Tikuvchi</p>
                    <p class="text-xs text-slate-400 mt-0.5">ID: 1025</p>
                </div>
            </div>
            <span class="px-3 py-1 bg-emerald-50 text-emerald-600 text-xs font-semibold rounded-full">● Ishda</span>
        </div>

        <!-- Sub Tabs -->
        <div class="flex bg-slate-200/70 p-1 rounded-2xl mb-5">
            <button class="tap-effect flex-1 py-2 bg-purple-600 text-white rounded-xl text-xs font-semibold shadow-sm">Umumiy</button>
            <button class="tap-effect flex-1 py-2 text-slate-600 text-xs font-semibold">Kundalik</button>
            <button class="tap-effect flex-1 py-2 text-slate-600 text-xs font-semibold">Statistika</button>
        </div>

        <!-- Bugungi ma'lumotlar -->
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4">
            <h4 class="font-bold text-sm text-slate-800 mb-2">Bugungi ma'lumotlar</h4>
            
            <div class="flex justify-between items-center text-sm py-2 border-b border-slate-50">
                <span class="text-slate-500 text-xs">Ishga kelgan vaqti</span>
                <span class="font-semibold text-slate-800 text-xs">09:02</span>
            </div>
            <div class="flex justify-between items-center text-sm py-2 border-b border-slate-50">
                <span class="text-slate-500 text-xs">Tanaffusga chiqqan</span>
                <span class="font-semibold text-slate-800 text-xs">11:45</span>
            </div>
            <div class="flex justify-between items-center text-sm py-2 border-b border-slate-50">
                <span class="text-slate-500 text-xs">Tanaffusdan qaytgan</span>
                <span class="font-semibold text-slate-800 text-xs">12:15</span>
            </div>
            <div class="flex justify-between items-center text-sm py-2">
                <span class="text-slate-500 text-xs">Ishni tugatgan</span>
                <span class="font-semibold text-slate-400 text-xs">---</span>
            </div>
        </div>

        <!-- Statistik ko'rsatkichlar -->
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 mt-4 space-y-4">
            <div class="flex justify-between items-center text-sm py-2 border-b border-slate-50">
                <span class="text-slate-500 text-xs">Jami ishlagan vaqt</span>
                <span class="font-bold text-purple-600 text-xs">3 soat 13 daqiqa</span>
            </div>
            <div class="flex justify-between items-center text-sm py-2 border-b border-slate-50">
                <span class="text-slate-500 text-xs">Tanaffuslar soni</span>
                <span class="font-semibold text-slate-800 text-xs">1 marta</span>
            </div>
            <div class="flex justify-between items-center text-sm py-2">
                <span class="text-slate-500 text-xs">Tanaffusdagi umumiy vaqt</span>
                <span class="font-semibold text-slate-800 text-xs">30 daqiqa</span>
            </div>
        </div>
    </main>
</body>
</html>
