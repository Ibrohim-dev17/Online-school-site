<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Notes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        /* Yuqori panel: faqat orqaga qaytish tugmasi */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .back-btn {
            background: transparent;
            color: #666;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: #fff;
        }

        /* Yozuv maydoni */
        .note-area {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1.2rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px;
        }

        /* Fokus bo'lganda ham chiziqlar chiqmaydi */
        .note-area::placeholder {
            color: #333;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="back-btn">[ Chiqish ]</a>
    </div>

    <textarea id="notepad" class="note-area" placeholder="Fikrlaringizni shu yerga yozing... (Avtomatik saqlanadi)"></textarea>

    <script>
        const notepad = document.getElementById('notepad');

        // Oldingi saqlangan matnni yuklash
        if (localStorage.getItem('saved_note')) {
            notepad.value = localStorage.getItem('saved_note');
        }

        // Har bir harf yozilganda avtomatik saqlash
        notepad.addEventListener('input', () => {
            localStorage.setItem('saved_note', notepad.value);
        });
    </script>
</body>
</html>
