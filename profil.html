<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chevarxona Pro - Profil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between pb-24">

    <!-- Telegram oyna tugmalari bilan qo'shilib ketmasligi uchun bo'shliq -->
    <div class="w-full">
        <div class="h-2 w-full bg-transparent"></div>

        <header class="px-4 py-2.5 bg-white flex items-center justify-between border-b border-gray-100">
            <h1 class="font-bold text-gray-800 text-sm">Foydalanuvchi profili</h1>
        </header>

        <main class="p-3 space-y-3 max-w-xl mx-auto w-full">
            <!-- Profil rasmi va ism qismi -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center text-center space-y-3">
                <div class="relative">
                    <div id="avatar-container" class="w-20 h-20 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-2xl font-bold overflow-hidden border-2 border-purple-200">
                        <span id="avatar-initials">M</span>
                        <img id="avatar-img" src="" alt="Avatar" class="w-full h-full object-cover hidden">
                    </div>
                    <label for="image-upload" class="absolute bottom-0 right-0 bg-purple-600 text-white p-1.5 rounded-full shadow-md cursor-pointer hover:bg-purple-700 transition">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                    </label>
                    <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                </div>

                <div>
                    <h2 id="profile-name-title" class="text-base font-bold text-gray-800">Malika</h2>
                    <p class="text-xs text-gray-400">Chevar / Ustoz</p>
                </div>
            </div>

            <!-- Ma'lumotlarni tahrirlash formasi -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                <h3 class="font-bold text-gray-800 text-xs">Ma'lumotlarni o'zgartirish</h3>
                
                <div>
                    <label class="block text-[11px] text-gray-500 mb-1">Ism va familiya</label>
                    <input type="text" id="name-input" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs text-gray-800 focus:outline-none focus:border-purple-500" placeholder="Ismingizni kiriting">
                </div>

                <button onclick="saveProfile()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-sm">
                    Saqlash
                </button>
            </div>
        </main>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 px-2 z-50">
        <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
            <span class="text-[10px] mt-1">Asosiy</span>
        </a>
        <a href="tarix.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
            <span class="text-[10px] mt-1">Mening tarixim</span>
        </a>
        <a href="statistika.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/></svg>
            <span class="text-[10px] mt-1">Statistika</span>
        </a>
        <a href="profil.html" class="flex flex-col items-center text-purple-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/></svg>
            <span class="text-[10px] mt-1 font-medium">Profil</span>
        </a>
    </nav>

    <script>
        // Sahifa yuklanganda saqlangan ma'lumotlarni chiqarish
        window.addEventListener('DOMContentLoaded', () => {
            let savedName = localStorage.getItem('user_name') || 'Malika';
            let savedAvatar = localStorage.getItem('user_avatar');

            document.getElementById('name-input').value = savedName;
            document.getElementById('profile-name-title').innerText = savedName;

            if (savedAvatar) {
                let imgEl = document.getElementById('avatar-img');
                let initialEl = document.getElementById('avatar-initials');
                imgEl.src = savedAvatar;
                imgEl.classList.remove('hidden');
                initialEl.classList.add('hidden');
            } else {
                document.getElementById('avatar-initials').innerText = savedName.charAt(0).toUpperCase();
            }
        });

        // Ismni saqlash
        function saveProfile() {
            let nameVal = document.getElementById('name-input').value.trim();
            if (nameVal) {
                localStorage.setItem('user_name', nameVal);
                document.getElementById('profile-name-title').innerText = nameVal;
                alert("Muvaffaqiyatli saqlandi!");
            }
        }

        // Galareyadan rasm yuklash (Base64 formatiga o'tkazib saqlanadi)
        function handleImageUpload(event) {
            let file = event.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    let base64Image = e.target.result;
                    localStorage.setItem('user_avatar', base64Image);

                    let imgEl = document.getElementById('avatar-img');
                    let initialEl = document.getElementById('avatar-initials');
                    imgEl.src = base64Image;
                    imgEl.classList.remove('hidden');
                    initialEl.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
