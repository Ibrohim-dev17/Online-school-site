<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafiya: O'zbekiston Milliy Ligas</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;600&display=swap');
        
        /* Mafia-style font - "Mafiya" yoki "Don" kabi jiddiy so'zlar uchun */
        .mafia-font { font-family: 'Cinzel', serif; text-transform: uppercase; letter-spacing: 0.15em; }
        /* Tana matnlari uchun qulay shrift */
        .body-font { font-family: 'Poppins', sans-serif; }
        
        /* Karta aylanish animatsiyasi (3D) */
        .card-flip { perspective: 1200px; }
        .card-inner {
            transition: transform 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        .flipped { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; border-radius: 1.5rem; overflow: hidden; }
        .card-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-black text-gray-100 body-font min-h-screen p-4 flex flex-col justify-between">

    <header class="text-center py-5 border-b-2 border-red-900/40">
        <h1 class="text-3xl font-extrabold tracking-widest text-red-700 mafia-font">MAFIYA MILLIY LIGASI</h1>
        <p id="player-name" class="text-[11px] text-gray-400 mt-1 uppercase tracking-wider">O'yinchi: Yuklanmoqda...</p>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center my-6">
        
        <div class="card-flip w-64 h-96 cursor-pointer" onclick="revealRole()">
            <div id="mafiaCard" class="card-inner w-full h-full relative">
                
                <div class="card-front absolute w-full h-full border-2 border-red-700 shadow-2xl flex flex-col items-center justify-center p-6 text-center bg-cover bg-center" 
                     style="background-image: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(20,0,0,0.95)), url('https://images.unsplash.com/photo-1577702066863-71a2e973c713?auto=format&fit=crop&q=80&w=600');">
                    <div class="w-16 h-16 bg-red-600/10 rounded-full flex items-center justify-center border border-red-600 mb-5 shadow-lg">
                        <span class="text-red-500 text-3xl font-bold mafia-font">M</span>
                    </div>
                    <h3 class="text-xl font-bold text-red-500 mafia-font tracking-wide">RO'LINGIZNI OCHING</h3>
                    <p class="text-[10px] text-gray-400 mt-2 px-3 leading-relaxed">Karta ustiga bosing va taqdiringizni bilib oling</p>
                </div>

                <div id="cardBackView" class="card-back absolute w-full h-full border-2 shadow-2xl flex flex-col justify-between bg-cover bg-center">
                    
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-black/80 z-0"></div>

                    <div class="z-10 p-5 flex flex-col h-full justify-between text-center">
                        <div class="flex justify-center">
                            <span id="roleBadge" class="text-[10px] font-semibold uppercase tracking-widest px-3.5 py-1 rounded-full text-white shadow-md">Yuklanmoqda</span>
                        </div>
                        
                        <div class="mb-2 bg-black/60 p-3 rounded-2xl backdrop-blur-sm">
                            <h2 id="roleTitle" class="text-2xl font-bold mafia-font text-white tracking-wide">RO'L</h2>
                            <p id="roleDesc" class="text-[11px] text-gray-100 mt-2 leading-relaxed px-1">Tavsif yuklanmoqda...</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <footer class="bg-gray-900/70 border-t-2 border-red-900/40 p-4 rounded-t-3xl backdrop-blur-md">
        <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-semibold text-gray-400">O'yin Holati:</span>
            <span id="gameStatus" class="bg-red-600/30 text-red-400 text-[10px] px-2.5 py-1 rounded-lg font-bold uppercase tracking-wider">Karta bosqichi</span>
        </div>
        <p class="text-center text-xs text-gray-500 leading-relaxed">Barcha o'yinchilar kartalarini ochganlaridan so'ng, o'yin boshlanadi.</p>
    </footer>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#000000'; // App qorong'u fonga to'liq moslashadi

        // Telegram foydalanuvchi ismini olish
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('player-name').innerText = `O'yinchi: ${tg.initDataUnsafe.user.first_name}`;
        }

        // O'zbekona atmosferik rasmlar bazasi (Unsplash portretlari)
        const roles = [
            {
                title: "MAFIYA DONI",
                badge: "Mafiya",
                // Qattiqqo'l, jiddiy qiyofadagi kishi
                img: "https://images.unsplash.com/photo-1549237511-6b64e006ce65?auto=format&fit=crop&q=80&w=600",
                desc: "Shaharning haqiqiy egasi. Tunda sheriklaringiz bilan birga kimnidir qurbon qiling.",
                border: "border-red-600",
                badgeBg: "bg-red-600"
            },
            {
                title: "KOMISSAR",
                badge: "Hukumat",
                // Jiddiy, do'ppi kiygan detektiv uslubidagi kishi
                img: "https://images.unsplash.com/photo-1517462964-21fdcec3f25b?auto=format&fit=crop&q=80&w=600",
                desc: "Qonun himoyachisi. Har tunda bir marta gumonlanuvchining roylini yashirincha tekshiring.",
                border: "border-blue-600",
                badgeBg: "bg-blue-600"
            },
            {
                title: "DOKTOR",
                badge: "Hukumat",
                // Shifokor yoki mehribon qiyofadagi kishi
                img: "https://images.unsplash.com/photo-1614359833899-6e1cf294136e?auto=format&fit=crop&q=80&w=600",
                desc: "Insonlar hayotini asrovchi. Har tunda bir kishini mafiya o'qidan davolab, saqlab qoling.",
                border: "border-green-600",
                badgeBg: "bg-green-600"
            },
            {
                title: "TINCH AHOLI",
                badge: "Xalq",
                // Oddiy o'zbek fuqarosi
                img: "https://images.unsplash.com/photo-1542156822-6924d1a71ace?auto=format&fit=crop&q=80&w=600",
                desc: "Sizda maxsus kuch yo'q, lekin sizning ovozingiz - qurolingizdir. Mafiyalarni toping.",
                border: "border-slate-500",
                badgeBg: "bg-slate-600"
            }
        ];

        let isFlipped = false;

        function revealRole() {
            const card = document.getElementById('mafiaCard');
            const cardBackView = document.getElementById('cardBackView');
            
            if (!isFlipped) {
                // Tasodifiy rol tanlash
                const randomRole = roles[Math.floor(Math.random() * roles.length)];
                
                // Rasm va stilni o'rnatish
                cardBackView.style.backgroundImage = `url('${randomRole.img}')`;
                cardBackView.className = `card-back absolute w-full h-full border-2 shadow-2xl flex flex-col justify-between overflow-hidden bg-cover bg-center ${randomRole.border}`;
                
                document.getElementById('roleBadge').innerText = randomRole.badge;
                document.getElementById('roleBadge').className = `text-[10px] font-semibold uppercase tracking-widest px-3.5 py-1 rounded-full text-white shadow-md ${randomRole.badgeBg}`;
                document.getElementById('roleTitle').innerText = randomRole.title;
                document.getElementById('roleDesc').innerText = randomRole.desc;

                // Telegram Vibratsiya (Haptic Feedback)
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }

                card.classList.add('flipped');
                isFlipped = true;
            } else {
                // Agar karta ochiq bo'lsa, uni yopish (foydalanuvchi qayta ko'rishi uchun)
                card.classList.remove('flipped');
                isFlipped = false;
            }
        }
    </script>
</body>
</html>
