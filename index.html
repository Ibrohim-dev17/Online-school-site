    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background:#0f172a;
            color:white;
            text-align:center;
        }

        header{
            padding:20px;
            background:rgba(255,255,255,0.05);
        }

        header h1{
            color:#38bdf8;
        }

        .hero{
            padding:80px 20px 40px;
        }

        .hero h2{
            font-size:42px;
            margin-bottom:15px;
        }

        .hero p{
            opacity:0.8;
            margin-bottom:25px;
        }

        .btn{
            display:inline-block;
            padding:15px 35px;
            background:#38bdf8;
            color:black;
            font-weight:600;
            border-radius:10px;
            text-decoration:none;
            transition:0.3s;
        }

        .btn:hover{
            background:#0ea5e9;
        }

        /* BO‘LIMLAR */
        .sections{
            margin-top:50px;
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
            gap:20px;
            padding:0 30px 60px;
        }

        .card{
            background:rgba(255,255,255,0.05);
            padding:25px;
            border-radius:15px;
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-8px);
            background:rgba(56,189,248,0.15);
        }

        .card a{
            display:block;
            margin-top:10px;
            color:#38bdf8;
            text-decoration:none;
            font-weight:500;
        }

        footer{
            padding:20px;
            opacity:0.6;
        }
    </style>
</head>

    </div>
