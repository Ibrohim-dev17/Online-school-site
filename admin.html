<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chevarxona Pro - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between pb-24">

    <header class="p-4 mt-12 bg-white shadow-sm flex justify-between items-center sticky top-12 z-40">
        <h1 class="font-bold text-gray-800 text-base">Admin panel</h1>
        <span class="text-xs text-purple-600 font-semibold bg-purple-50 px-2.5 py-1 rounded-lg">Barcha xodimlar</span>
    </header>

    <main class="p-4 space-y-4 max-w-xl mx-auto w-full">
        <!-- Statistikalar -->
        <div class="grid grid-cols-4 gap-2 text-center">
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-[10px] text-gray-400">Jami</p>
                <h4 class="text-sm font-bold text-gray-800">128</h4>
            </div>
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-[10px] text-emerald-500 font-bold">Ishda</p>
                <h4 class="text-sm font-bold text-gray-800" id="admin-working-count">1</h4>
            </div>
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-[10px] text-amber-500 font-bold">Tanaffus</p>
                <h4 class="text-sm font-bold text-gray-800" id="admin-break-count">0</h4>
            </div>
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-[10px] text-gray-400">Kelgan</p>
                <h4 class="text-sm font-bold text-gray-800">9</h4>
            </div>
        </div>

        <!-- Xodimlar ro'yxati -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
            <h3 class="font-bold text-gray-700 text-sm">Xodimlar ro'yxati (Real vaqt)</h3>
            
            <div class="flex items-center justify-between p-2 hover:bg-gray-50 rounded-xl transition">
                <div class="flex items-center gap-3">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="w-10 h-10 rounded-full object-cover">
                    <div>
                        <h4 class="font-bold text-gray-800 text-sm">Malika Abdullayeva</h4>
                        <p class="text-xs text-gray-400">ID: 1025 - 1-sektor</p>
                    </div>
                </div>
                <div class="text-right">
                    <span id="admin-malika-status" class="text-xs px-2 py-0.5 rounded-full font-semibold bg-amber-100 text-amber-600">Ish boshlanmadi</span>
                    <p class="text-[10px] text-gray-400 mt-1" id="admin-malika-time">0 soat</p>
                </div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 px-2 z-50">
        <a href="admin.html" class="flex flex-col items-center text-purple-600"><i class="fa-solid fa-chart-pie text-lg"></i><span class="text-xs mt-1 font-medium">Dashboard</span></a>
        <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600"><i class="fa-solid fa-user text-lg"></i><span class="text-xs mt-1">Xodim</span></a>
    </nav>

    <script>
        let state = JSON.parse(localStorage.getItem('malika_state')) || { workSec: 0, status: 'STOPPED', startTime: '' };

        function formatTimeShort(s) {
            let h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
            return `${h} soat ${m} daqiqa`;
        }

        const statusBadge = document.getElementById('admin-malika-status');
        if (state.status === 'WORKING') {
            statusBadge.className = "text-xs px-2 py-0.5 rounded-full font-semibold bg-emerald-100 text-emerald-600";
            statusBadge.innerText = "Ishda";
        } else if (state.status === 'BREAK') {
            statusBadge.className = "text-xs px-2 py-0.5 rounded-full font-semibold bg-amber-100 text-amber-600";
            statusBadge.innerText = "Tanaffusda";
        } else if (state.status === 'FINISHED') {
            statusBadge.className = "text-xs px-2 py-0.5 rounded-full font-semibold bg-rose-100 text-rose-600";
            statusBadge.innerText = "Ish tugadi";
        }

        document.getElementById('admin-malika-time').innerText = formatTimeShort(state.workSec);
    </script>
</body>
</html>
