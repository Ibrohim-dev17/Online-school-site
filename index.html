<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars Trading App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Chart.js grafiklar uchun (yoki TradingView yields ishlatsa bo'ladi) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #131722;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e222d;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .balance {
            font-size: 18px;
            font-weight: bold;
            color: #f1b90c; /* Stars oltin rangi */
        }
        .price-display {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
            color: #00e676;
        }
        .chart-container {
            background: #1e222d;
            border-radius: 10px;
            padding: 10px;
            height: 220px;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-deposit { background-color: #f1b90c; color: #000; width: 100%; margin-bottom: 15px;}
        .btn-buy { background-color: #00c853; color: white; }
        .btn-sell { background-color: #ff3d00; color: white; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <!-- Header: Balans va Foydalanuvchi -->
    <div class="header">
        <span id="username">Foydalanuvchi</span>
        <span class="balance">⭐ <span id="stars-balance">0</span> Stars</span>
    </div>

    <!-- Depozit tugmasi -->
    <button class="btn-deposit" onclick="makeDeposit()">➕ Stars Depozit Qilish</button>

    <!-- Aktiv va Joriy Narx -->
    <div id="asset-name">TON / USDT</div>
    <div class="price-display" id="current-price">$7.350</div>

    <!-- Grafik -->
    <div class="chart-container">
        <canvas id="tradingChart"></canvas>
    </div>

    <!-- Savdo Tugmalari -->
    <div class="btn-group">
        <button class="btn-buy" onclick="openOrder('BUY')">📈 LONG (BUY)</button>
        <button class="btn-sell" onclick="openOrder('SELL')">📉 SHORT (SELL)</button>
    </div>

    <script>
        // Telegram Web App-ni ishga tushiramiz
        const tg = window.Telegram.WebApp;
        tg.expand(); // Oynani to'liq ochish

        // Foydalanuvchi nomini o'rnatish
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }

        // Demo ma'lumotlar
        let balance = 500;
        let currentPrice = 7.35;
        document.getElementById('stars-balance').innerText = balance;

        // Chart.js grafik sozlamalari
        const ctx = document.getElementById('tradingChart').getContext('2d');
        const priceData = [7.31, 7.33, 7.32, 7.36, 7.34, 7.35];
        const labels = ['', '', '', '', '', ''];

        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    data: priceData,
                    borderColor: '#00e676',
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: false,
                    tension: 0.2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { grid: { color: '#2a2e39' } } }
            }
        });

        // Narxni simulyatsiya qilib o'zgartirib turish (Real vaqtda API bo'ladi)
        setInterval(() => {
            let change = (Math.random() - 0.5) * 0.04;
            currentPrice = (currentPrice + change).toFixed(3);
            document.getElementById('current-price').innerText = '$' + currentPrice;

            // Grafikni yangilash
            priceData.push(currentPrice);
            labels.push('');
            if(priceData.length > 15) { priceData.shift(); labels.shift(); }
            
            // Narx rangini o'zgartirish
            document.getElementById('current-price').style.color = change >= 0 ? '#00c853' : '#ff3d00';
            chart.data.datasets[0].borderColor = change >= 0 ? '#00c853' : '#ff3d00';
            chart.update();
        }, 2000);

        // Depozit funksiyasi (Telegram Stars Invoice chaqiradi)
        function makeDeposit() {
            tg.showPopup({
                title: 'Depozit',
                message: 'Backend orqali Telegram Stars hisob-fakturasi yuklanadi.',
                buttons: [{type: 'ok'}]
            });
            // Bu yerda backendga so'rov yuboriladi va tg.openInvoice(url) chaqiriladi
        }

        // Savdo ochish funksiyasi
        function openOrder(type) {
            tg.showPopup({
                title: 'Savdo ochildi',
                message: `Siz ${currentPrice} narxida ${type} orderini ochdingiz!`,
                buttons: [{type: 'close'}]
            });
        }
    </script>
</body>
</html>
