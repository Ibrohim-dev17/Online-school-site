<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUE MAFIYA - Kutish Xonasi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap');
        .cyber-font { font-family: 'Space Grotesk', sans-serif; }
        
        /* Ichki sahifa uchun ham mukammal qorong'u, neonli liminal fon */
        body {
            background: radial-gradient(circle at 50% 10%, rgba(25, 2, 2, 0.95) 0%, rgba(0, 0, 0, 1) 80%);
            background-color: #000;
        }
        .panel-glow {
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(220, 38, 38, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="text-white cyber-font min-h-screen flex flex-col justify-between p-4">

    <header class="panel-glow p-4 rounded-2xl flex justify-between items-center border-l-4 border-l-red-600">
        <div>
            <h2 id="displayRoomName" class="font-bold text-red-500 tracking-wide text-base">Xona Yuklanmoqda...</h2>
            <p class="text-[10px] text-zinc-500 uppercase">Kutish rejimi</p>
        </div>
        <span class="bg-red-600/10 text-red-500 border border-red-500/20 text-xs px-3 py-1 rounded-xl font-bold animate-pulse">7 / 15 Kishi</span>
    </header>

    <div class="grid grid-cols-2 gap-2 my-3">
        <button onclick="toggleSection('chatSection')" class="bg-zinc-950 border border-zinc-800 py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 hover:border-red-600/40 transition">
            💬 UMUMIY CHAT
        </button>
        <button onclick="toggleVoice()" id="voiceBtn" class="bg-zinc-950 border border-zinc-800 text-zinc-400 py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition">
            🎙 OVOZLI ALOQA: OFF
        </button>
    </div>

    <div id="chatSection" class="panel-glow p-3 rounded-2xl h-44 flex flex-col justify-between mb-3 border-zinc-900">
        <div id="chatMessages" class="overflow-y-auto space-y-1.5 text-left text-xs flex-1 pr-1 text-zinc-300">
            <p><span class="text-red-500 font-bold">[Tizim]:</span> Haqiqiy "True Mafiya" loyihasiga xush kelibsiz. O'yin tez orada boshlanadi.</p>
        </div>
        <div class="flex gap-2 mt-2">
            <input id="chatInput" type="text" placeholder="Xabar yozing..." class="flex-1 bg-zinc-900/60 border border-zinc-800 p-2.5 rounded-xl text-xs outline-none focus:border-red-600/40 text-white">
            <button onclick="sendMessage()" class="bg-red-700 hover:bg-red-600 px-4 rounded-xl text-xs font-bold transition">➡️</button>
        </div>
    </div>

    <main class="flex-1 overflow-y-auto mb-4 panel-glow p-4 rounded-2xl border-zinc-900/60">
        <h3 class="text-[10px] text-zinc-500 mb-3 uppercase tracking-wider font-bold">Ulanish nuqtalari:</h3>
        <div class="grid grid-cols-2 gap-2" id="playersList">
            </div>
    </main>

    <div>
        <button id="actionBtn" onclick="goToGame()" class="w-full bg-red-700 hover:bg-red-600 text-white font-bold py-4 rounded-2xl text-xs tracking-widest uppercase transition shadow-md shadow-red-950/50">
            O'yinni faollashtirish
        </button>
    </div>

    <script {current_year}=2026>
        const tg = window.Telegram.WebApp;
        
        const roomName = localStorage.getItem('currentRoomName') || "True Mafia Hall";
        const isAdmin = localStorage.getItem('isAdmin') === 'true';
        document.getElementById('displayRoomName').innerText = roomName;

        const actionBtn = document.getElementById('actionBtn');
        if (!isAdmin) {
            actionBtn.innerText = "ADMIN BOSHLASHINI KUTISH";
            actionBtn.className = "w-full bg-zinc-900 text-zinc-600 font-bold py-4 rounded-2xl text-xs tracking-widest uppercase cursor-not-allowed border border-zinc-800/30";
            actionBtn.disabled = true;
        }

        const players = ['Siz (Admin)', 'Anvar', 'Jasur', 'Malika', 'Kamola', 'Rustam', 'Sardor'];
        const listContainer = document.getElementById('playersList');
        players.forEach((p, index) => {
            listContainer.innerHTML += `
                <div class="bg-zinc-900/40 p-3 rounded-xl border border-zinc-900/80 flex items-center justify-between">
                    <span class="text-xs truncate font-medium text-zinc-300">${p}</span>
                    <span class="w-1.5 h-1.5 rounded-full ${index === 0 ? 'bg-red-500' : 'bg-red-500/40'}"></span>
                </div>`;
        });

        function sendMessage() {
            const input = document.getElementById('chatInput');
            if(!input.value.trim()) return;
            const msgBox = document.getElementById('chatMessages');
            msgBox.innerHTML += `<p><span class="text-zinc-500 font-bold">Siz:</span> ${input.value}</p>`;
            input.value = '';
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        let voice = false;
        function toggleVoice() {
            voice = !voice;
            const btn = document.getElementById('voiceBtn');
            if(voice) {
                btn.className = "bg-red-950 border border-red-500 text-red-500 py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition";
                btn.innerText = "🎙 OVOZLI ALOQA: ON";
            } else {
                btn.className = "bg-zinc-950 border border-zinc-800 text-zinc-400 py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition";
                btn.innerText = "🎙 OVOZLI ALOQA: OFF";
            }
        }

        function toggleSection(id) { document.getElementById(id).classList.toggle('hidden'); }
        function goToGame() { alert("Rollar taqsimlanmoqda... Game tizimi yuklanmoqda."); }
    </script>
</body>
</html>
