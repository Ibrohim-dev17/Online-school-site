<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chevarxona Pro - Sozlamalar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f4f5f9; }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between pb-20">

    <header class="px-4 py-3 bg-white shadow-sm flex items-center justify-between sticky top-0 z-50">
        <h1 class="font-bold text-gray-800 text-xs">Sozlamalar</h1>
    </header>

    <main class="p-4 space-y-4 flex-1">
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm space-y-3">
            <h3 class="text-xs font-bold text-gray-800">Baza ma'lumotlari</h3>
            <button onclick="clearData()" class="w-full bg-rose-50 text-rose-600 font-medium py-2.5 rounded-xl text-xs">Barcha ma'lumotlarni tozalash</button>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around py-2.5 px-1 z-50 shadow-lg">
        <a href="admindashboard.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600"><span class="text-[9px] mt-1">Dashboard</span></a>
        <a href="adminishchilar.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600"><span class="text-[9px] mt-1">Ishchilar</span></a>
        <a href="statistika.html" class="flex flex-col items-center text-gray-400 hover:text-purple-600"><span class="text-[9px] mt-1">Statistika</span></a>
        <a href="adminsetting.html" class="flex flex-col items-center text-purple-600"><span class="text-[9px] mt-1 font-semibold">Sozlamalar</span></a>
    </nav>

    <script>
        function clearData() {
            if(confirm("Haqiqatan ham barcha ma'lumotlarni o'chirmoqchimisiz?")) {
                localStorage.removeItem('chevarxona_workers');
                alert("Tozalandi!");
                window.location.href = 'admindashboard.html';
            }
        }
    </script>
</body>
</html>
