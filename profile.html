<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BilimGo - Profile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { background-color: #0f1026; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 420px; height: 100vh; max-height: 900px; background-color: #0f1026; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; }
        .header-title { font-size: 18px; font-weight: 700; }
        .content { flex: 1; overflow-y: auto; padding: 0 24px 24px 24px; }
        .content::-webkit-scrollbar { display: none; }
        .profile-card { display: flex; align-items: center; gap: 16px; background: #181938; border: 1px solid rgba(255,255,255,0.05); padding: 20px; border-radius: 20px; margin-bottom: 20px; }
        .avatar { width: 60px; height: 60px; background: #3b82f6; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .avatar svg { width: 30px; height: 30px; fill: #fff; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; background: #181938; border: 1px solid rgba(255,255,255,0.05); padding: 18px; border-radius: 20px; text-align: center; margin-bottom: 24px; }
        .stat-item p:first-child { font-size: 12px; color: #9ca3af; margin-bottom: 4px; }
        .stat-item p:last-child { font-size: 18px; font-weight: bold; }
        .menu-list { display: flex; flex-direction: column; gap: 10px; }
        .menu-item { background: #181938; border: 1px solid rgba(255,255,255,0.05); padding: 16px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .menu-item:hover { border-color: #8b5cf6; background: #20224d; }
        .menu-left { display: flex; align-items: center; gap: 12px; }
        .menu-left svg { width: 20px; height: 20px; fill: #a78bfa; }
        .bottom-nav { display: flex; justify-content: space-around; background: #151632; padding: 12px 0 20px 0; border-top: 1px solid rgba(255,255,255,0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6b7280; font-size: 11px; text-decoration: none; }
        .nav-item.active { color: #8b5cf6; }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="header-title">Profile</div>
            <svg style="width:20px;height:20px;fill:#9ca3af;" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </div>
        
        <div class="content">
            <div class="profile-card">
                <div class="avatar">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <div>
                    <h4 id="username" style="font-size: 16px; font-weight: bold; margin-bottom: 2px;">BilimGo Learner</h4>
                    <p style="font-size: 12px; color: #a78bfa;">Active Member</p>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <p>Level</p>
                    <p>A1</p>
                </div>
                <div class="stat-item">
                    <p>Words</p>
                    <p>212</p>
                </div>
                <div class="stat-item">
                    <p>Streak</p>
                    <p style="color: #f59e0b;">12 ⚡</p>
                </div>
            </div>

            <div class="menu-list">
                <div class="menu-item" onclick="alert('Bookmarks')">
                    <div class="menu-left">
                        <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                        <span>Bookmarks</span>
                    </div>
                    <span style="color: #4b5563;">›</span>
                </div>
                <div class="menu-item" onclick="alert('Achievements')">
                    <div class="menu-left">
                        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                        <span>Achievements</span>
                    </div>
                    <span style="color: #4b5563;">›</span>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="home.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Home</span>
            </a>
            <a href="categories.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
                <span>Learn</span>
            </a>
            <a href="#" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                <span>Challenges</span>
            </a>
            <a href="profile.html" class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>Profile</span>
            </a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe.user) {
                const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
                const nameField = document.getElementById('username');
                if (tgUser.first_name) {
                    nameField.innerText = tgUser.first_name;
                }
            }
        });
    </script>
</body>
</html>
