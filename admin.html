<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chevarxona Pro - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between pb-24">

    <!-- Admin Header -->
    <header class="px-4 pb-4 pt-14 bg-white shadow-md flex justify-between items-center sticky top-0 z-50 w-full max-w-xl mx-auto rounded-b-2xl">
        <div class="flex items-center gap-3">
            <button class="text-gray-600 text-xl"><i class="fa-solid fa-bars"></i></button>
            <div>
                <h1 class="font-bold text-gray-800 text-base">Admin panel</h1>
                <p class="text-xs text-gray-400">Barcha ishchilar nazorati</p>
            </div>
        </div>
        <!-- Qo'ng'iroq o'rniga Chat iconi -->
        <div class="flex items-center gap-3">
            <a href="#" class="relative w-10 h-10 bg-purple-50 hover:bg-purple-100 text-purple-600 rounded-full flex items-center justify-center transition shadow-sm" title="Chat">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 0 1-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8Z"/></svg>
                <span class="absolute top-2 right-2 w-2 h-2 bg-purple-600 rounded-full"></span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-4 space-y-4 max-w-xl mx-auto w-full mt-2">
        
        <!-- Sana ko'rsatkich (Kun, hafta, oy olib tashlandi) -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
            <div class="flex items-center gap-2 text-sm font-semibold text-gray-700">
                <i class="fa-regular fa-calendar text-purple-600"></i>
                <span id="admin-current-date" class="text-gray-800 font-bold">Yuklanmoqda...</span>
            </div>
            <span class="text-xs bg-purple-50 text-purple-600 px-2.5 py-1 rounded-lg font-semibold">Jonli kuzatuv</span>
        </div>

        <!-- Statistika Karta Grid -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-lg"><i class="fa-solid fa-users"></i></div>
                <div>
                    <p class="text-[10px] text-gray-400 uppercase font-semibold">Jami ishchilar</p>
                    <h4 class="text-lg font-bold text-gray-800" id="stat-total">4</h4>
                </div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg"><i class="fa-solid fa-building-columns"></i></div>
                <div>
                    <p class="text-[10px] text-gray-400 uppercase font-semibold">Ishda</p>
                    <h4 class="text-lg font-bold text-emerald-600" id="stat-working">0</h4>
                </div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg"><i class="fa-solid fa-mug-hot"></i></div>
                <div>
                    <p class="text-[10px] text-gray-400 uppercase font-semibold">Tanaffusda</p>
                    <h4 class="text-lg font-bold text-amber-600" id="stat-break">0</h4>
                </div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-lg"><i class="fa-solid fa-person-walking-arrow-right"></i></div>
                <div>
                    <p class="text-[10px] text-gray-400 uppercase font-semibold">Ketgan</p>
                    <h4 class="text-lg font-bold text-rose-600" id="stat-finished">0</h4>
                </div>
            </div>
        </div>

        <!-- Jonli Ish Jarayoni Progress -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-2">
            <div class="flex justify-between items-center text-xs font-bold text-gray-700">
                <span>Bugungi ish jarayoni</span>
                <span id="overall-efficiency" class="text-purple-600">0%</span>
            </div>
            <div class="w-full bg-gray-100 h-2.5 rounded-full overflow-hidden">
                <div id="overall-progress-bar" class="bg-purple-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <!-- Qidirish va Filtr -->
        <div class="flex gap-2">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
                <input type="text" id="search-input" oninput="filterEmployees()" placeholder="Qidirish..." class="w-full bg-white border border-gray-200 pl-10 pr-4 py-3 rounded-2xl text-sm focus:outline-none focus:border-purple-500 transition shadow-sm">
            </div>
            <button class="bg-white border border-gray-200 px-4 rounded-2xl text-gray-600 hover:bg-gray-50 shadow-sm"><i class="fa-solid fa-filter"></i></button>
        </div>

        <!-- Status filter tugmalari -->
        <div class="flex gap-2 overflow-x-auto pb-1 text-xs font-semibold">
            <button onclick="setStatusFilter('ALL')" id="filter-btn-ALL" class="bg-purple-600 text-white px-4 py-2 rounded-xl shadow-sm whitespace-nowrap transition">Barchasi</button>
            <button onclick="setStatusFilter('WORKING')" id="filter-btn-WORKING" class="bg-white text-gray-600 border border-gray-200 px-4 py-2 rounded-xl shadow-sm whitespace-nowrap transition">Ishda</button>
            <button onclick="setStatusFilter('BREAK')" id="filter-btn-BREAK" class="bg-white text-gray-600 border border-gray-200 px-4 py-2 rounded-xl shadow-sm whitespace-nowrap transition">Tanaffus</button>
            <button onclick="setStatusFilter('FINISHED')" id="filter-btn-FINISHED" class="bg-white text-gray-600 border border-gray-200 px-4 py-2 rounded-xl shadow-sm whitespace-nowrap transition">Ketgan</button>
        </div>

        <!-- Ishchilar ro'yxati -->
        <div class="space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="text-gray-700 font-bold text-sm">Ishchilar ro'yxati</h3>
                <span class="text-xs text-purple-600 font-semibold flex items-center gap-1"><i class="fa-solid fa-circle text-[8px] animate-ping"></i> Live</span>
            </div>

            <div id="employees-list" class="space-y-3">
                <!-- JavaScript orqali dinamik to'ldiriladi -->
            </div>
        </div>

    </main>

    <!-- Admin Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 px-2 z-50">
        <a href="admin.html" class="flex flex-col items-center text-purple-600">
            <i class="fa-solid fa-chart-pie text-xl"></i>
            <span class="text-[10px] mt-1 font-semibold">Dashboard</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 hover:text-purple-600">
            <i class="fa-solid fa-users text-xl"></i>
            <span class="text-[10px] mt-1">Ishchilar</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 hover:text-purple-600">
            <i class="fa-solid fa-chart-line text-xl"></i>
            <span class="text-[10px] mt-1">Hisobotlar</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 hover:text-purple-600">
            <i class="fa-solid fa-gear text-xl"></i>
            <span class="text-[10px] mt-1">Sozlamalar</span>
        </a>
    </nav>

    <script>
        // Hozirgi sanani chiqarish
        const now = new Date();
        document.getElementById('admin-current-date').innerText = now.toLocaleDateString('uz-UZ', { day: 'numeric', month: 'long', year: 'numeric' });

        // Standart ishchilar bazasi
        let defaultEmployees = [
            { id: "1025", name: "Malika Abdullayeva", sector: "1-sektor", avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100", status: "WORKING", startTime: "09:02", breakCount: 1, workSec: 19584 },
            { id: "1026", name: "Ziyodulla To'xtayev", sector: "2-sektor", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100", status: "BREAK", startTime: "11:45", breakCount: 1, workSec: 15120 },
            { id: "1027", name: "Dilorom Saidova", sector: "1-sektor", avatar: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100", status: "WORKING", startTime: "09:15", breakCount: 2, workSec: 18900 },
            { id: "1028", name: "Shahnoza Karimova", sector: "3-sektor", avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100", status: "FINISHED", startTime: "09:05", breakCount: 1, workSec: 27000 }
        ];

        // Asosiy sahifadagi (index.html) real vaqt ma'lumotlarini o'qib olish
        function getEmployeesData() {
            let malikaState = JSON.parse(localStorage.getItem('malika_state'));
            let malikaProfile = JSON.parse(localStorage.getItem('malika_profile'));
            
            let employees = [...defaultEmployees];
            
            if (malikaState) {
                let mIndex = employees.findIndex(e => e.id === "1025");
                if (mIndex !== -1) {
                    employees[mIndex].status = malikaState.status === 'STOPPED' ? 'STOPPED' : malikaState.status;
                    employees[mIndex].breakCount = malikaState.breakCount;
                    employees[mIndex].workSec = malikaState.workSec;
                    if (malikaState.startTime) employees[mIndex].startTime = malikaState.startTime.substring(0, 5);
                    if (malikaProfile && malikaProfile.name) employees[mIndex].name = malikaProfile.name;
                    if (malikaProfile && malikaProfile.avatar) employees[mIndex].avatar = malikaProfile.avatar;
                }
            }
            return employees;
        }

        let currentStatusFilter = 'ALL';

        function setStatusFilter(status) {
            currentStatusFilter = status;
            ['ALL', 'WORKING', 'BREAK', 'FINISHED'].forEach(s => {
                let btn = document.getElementById(`filter-btn-${s}`);
                if (s === status) {
                    btn.className = "bg-purple-600 text-white px-4 py-2 rounded-xl shadow-sm whitespace-nowrap transition";
                } else {
                    btn.className = "bg-white text-gray-600 border border-gray-200 px-4 py-2 rounded-xl shadow-sm whitespace-nowrap transition";
                }
            });
            renderAdminDashboard();
        }

        function formatHoursMins(s) {
            let h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
            return `${h}s ${m}d`;
        }

        function renderAdminDashboard() {
            let employees = getEmployeesData();
            let searchQuery = document.getElementById('search-input').value.toLowerCase();

            let total = employees.length;
            let working = employees.filter(e => e.status === 'WORKING').length;
            let breakCount = employees.filter(e => e.status === 'BREAK').length;
            let finished = employees.filter(e => e.status === 'FINISHED' || e.status === 'STOPPED').length;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-working').innerText = working;
            document.getElementById('stat-break').innerText = breakCount;
            document.getElementById('stat-finished').innerText = finished;

            let avgEff = Math.round(employees.reduce((acc, e) => acc + Math.min(Math.floor((e.workSec / (8 * 3600)) * 100), 100), 0) / total);
            document.getElementById('overall-efficiency').innerText = `${avgEff}%`;
            document.getElementById('overall-progress-bar').style.width = `${avgEff}%`;

            let filtered = employees.filter(e => {
                let matchesSearch = e.name.toLowerCase().includes(searchQuery) || e.id.includes(searchQuery);
                if (currentStatusFilter === 'ALL') return matchesSearch;
                if (currentStatusFilter === 'FINISHED') return matchesSearch && (e.status === 'FINISHED' || e.status === 'STOPPED');
                return matchesSearch && e.status === currentStatusFilter;
            });

            let listContainer = document.getElementById('employees-list');
            listContainer.innerHTML = '';

            if (filtered.length === 0) {
                listContainer.innerHTML = `<p class="text-center text-xs text-gray-400 py-4">Hech qanday ma'lumot topilmadi</p>`;
                return;
            }

            filtered.forEach(emp => {
                let statusBadge = '';
                let timeInfo = '';
                
                let eff = Math.min(Math.floor((emp.workSec / (8 * 3600)) * 100), 100);
                let timeFormatted = formatHoursMins(emp.workSec);

                if (emp.status === 'WORKING') {
                    statusBadge = `<span class="bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5"><span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Ishda</span>`;
                    timeInfo = `${emp.startTime} dan beri`;
                } else if (emp.status === 'BREAK') {
                    statusBadge = `<span class="bg-amber-50 text-amber-600 px-2.5 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5"><span class="w-1.5 h-1.5 bg-amber-500 rounded-full animate-pulse"></span> Tanaffusda</span>`;
                    timeInfo = `Dam olishda`;
                } else {
                    statusBadge = `<span class="bg-rose-50 text-rose-600 px-2.5 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5"><span class="w-1.5 h-1.5 bg-rose-500 rounded-full"></span> Ketgan</span>`;
                    timeInfo = `Kun yakunlandi`;
                }

                let itemHTML = `
                    <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <img src="${emp.avatar}" class="w-11 h-11 rounded-full object-cover border border-gray-200">
                            <div>
                                <h4 class="font-bold text-gray-800 text-sm">${emp.name}</h4>
                                <p class="text-xs text-gray-400">ID: ${emp.id} &bull; ${emp.sector}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="flex justify-end mb-1">${statusBadge}</div>
                            <p class="text-[11px] text-gray-500">${timeInfo}</p>
                            <p class="text-xs font-bold text-gray-700 mt-0.5">${timeFormatted} &bull; T:${emp.breakCount} &bull; <span class="text-purple-600">${eff}%</span></p>
                        </div>
                    </div>
                `;
                listContainer.innerHTML += itemHTML;
            });
        }

        function filterEmployees() {
            renderAdminDashboard();
        }

        renderAdminDashboard();
        
        // Har 1 sekundda asosiy sahifadagi o'zgarishlarni real vaqtda yangilab turish
        setInterval(renderAdminDashboard, 1000);
    </script>
</body>
</html>
